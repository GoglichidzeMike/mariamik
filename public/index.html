  --paper:#EEF0F5;--surface:#F8F9FC;--ink:#1B2040;--muted:#575D82;--rule:#C9CDDD;
  --gut:#A8730F;--heart:#AE3D61;--head:#1F737A;--growth:#2C7A4C;--stress:#B4432A;
  color-scheme:light;box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --paper:#11142A;--surface:#191D38;--ink:#E7E9F4;--muted:#A0A5C4;--rule:#2F3459;
  --gut:#E2AB40;--heart:#E57B9C;--head:#55B8BF;--growth:#62C389;--stress:#EA7E62;color-scheme:dark}}
:root[data-theme="dark"]{--paper:#11142A;--surface:#191D38;--ink:#E7E9F4;--muted:#A0A5C4;--rule:#2F3459;--gut:#E2AB40;--heart:#E57B9C;--head:#55B8BF;--growth:#62C389;--stress:#EA7E62;color-scheme:dark}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 64px);scroll-behavior:smooth}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}}
body{margin:0;background:var(--paper);color:var(--ink);font-family:"FiraGO","Sylfaen","DejaVu Sans",system-ui,sans-serif;font-size:17px;line-height:1.65}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--paper)}
h1,h2,h3{line-height:1.2;margin:0}
a{color:inherit}
button,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--ink);outline-offset:3px}
[hidden]{display:none!important}
.en{font-family:Georgia,"Times New Roman",serif;font-style:italic;font-weight:400;color:var(--muted)}
.eyebrow{font-size:.85rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600}
.btn{border:1.5px solid var(--ink);background:var(--ink);color:var(--paper);padding:.75rem 1.3rem;border-radius:12px;cursor:pointer;font-weight:600;text-decoration:none;display:inline-block;line-height:1.3}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--rule)}
.btn:hover{opacity:.9}

nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--paper);border-bottom:1px solid var(--rule)}
nav .in{max-width:1120px;margin:0 auto;padding:.55rem 1.25rem;display:flex;gap:1.1rem;align-items:center}
nav b{font-weight:800;flex:none}
nav .links{display:flex;gap:1.1rem;overflow-x:auto;white-space:nowrap;flex:1;scrollbar-width:none}
nav .links::-webkit-scrollbar{display:none}
nav a{text-decoration:none;color:var(--muted);font-size:.93rem}
nav a:hover{color:var(--ink)}
.langs{display:flex;gap:.25rem;flex:none}
.langs button{border:1px solid var(--rule);background:transparent;border-radius:999px;padding:.15rem .6rem;cursor:pointer;font-size:.82rem;color:var(--muted)}
.langs button[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--paper)}

.wrap{max-width:1120px;margin:0 auto;padding:0 1.25rem}
section{padding:3.5rem 0;border-top:1px solid var(--rule)}
section > .wrap > h2{font-size:clamp(1.8rem,4vw,2.5rem);font-weight:800;margin-bottom:.6rem}
.lead{max-width:66ch;color:var(--muted);margin:0 0 2rem}

/* test */
#test{border-top:0;padding:2.2rem 0 3.5rem}
#test .tw{max-width:760px;margin:0 auto;padding:0 1.25rem}
#test h1{font-size:clamp(2.4rem,6.5vw,3.8rem);font-weight:800;margin:.4rem 0 1rem;line-height:1.15}
#start p{max-width:58ch}
.tmodes{display:grid;grid-template-columns:1fr 1fr;gap:1rem;margin:2rem 0 1rem}
@media (max-width:520px){.tmodes{grid-template-columns:1fr}}
.mode{border:1.5px solid var(--rule);background:var(--surface);border-radius:14px;padding:1.2rem;text-align:left;cursor:pointer}
.mode:hover{border-color:var(--ink)}
.mode b{display:block;font-size:1.2rem;margin-bottom:.2rem}
.mode span{color:var(--muted);font-size:.92rem}
.tip{font-size:.9rem;color:var(--muted);border-left:3px solid var(--rule);padding-left:1rem;max-width:60ch}
.bar{height:6px;background:var(--rule);border-radius:99px;overflow:hidden;margin:.6rem 0 2.5rem}
.bar i{display:block;height:100%;background:var(--ink);transition:width .25s}
.qmeta{display:flex;justify-content:space-between;font-size:.9rem;color:var(--muted)}
.qtext{font-size:clamp(1.35rem,3.6vw,1.8rem);font-weight:600;line-height:1.35;min-height:4.2em;margin:0 0 1.8rem}
.scale{display:grid;grid-template-columns:repeat(5,1fr);gap:.5rem}
.scale button{border:1.5px solid var(--rule);background:var(--surface);border-radius:12px;padding:.9rem .3rem;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:.45rem;font-size:.8rem;line-height:1.25;text-align:center;color:var(--muted)}
.scale button .dot{width:var(--s);height:var(--s);border-radius:50%;border:2px solid var(--ink);background:transparent}
.scale button:hover{border-color:var(--ink);color:var(--ink)}
.scale button[aria-pressed="true"]{border-color:var(--ink);color:var(--ink);font-weight:600}
.scale button[aria-pressed="true"] .dot{background:var(--ink)}
@media (max-width:520px){.scale{grid-template-columns:1fr;gap:.4rem}.scale button{flex-direction:row;justify-content:flex-start;padding:.75rem 1rem;font-size:.95rem}.scale button .dot{width:18px;height:18px}}
.qnav{display:flex;justify-content:space-between;align-items:center;margin-top:1.6rem}
.qnav .hint{font-size:.82rem;color:var(--muted)}
@media (max-width:520px){.qnav .hint{display:none}}
#tb h2{font-size:clamp(1.6rem,4.5vw,2.2rem);margin:.4rem 0 .6rem}
#tb p{color:var(--muted);max-width:60ch}
.fc{display:grid;gap:.7rem;margin-top:1.5rem}
.fc button{border:1.5px solid var(--rule);background:var(--surface);border-radius:14px;padding:1.1rem 1.2rem;text-align:left;cursor:pointer;font-size:1.08rem;line-height:1.4}
.fc button:hover{border-color:var(--ink)}
.rhero{border:1.5px solid var(--rule);background:var(--surface);border-radius:18px;padding:1.6rem;margin:1rem 0 1.4rem;position:relative;overflow:hidden}
.rhero::after{content:attr(data-n);position:absolute;right:-.05em;bottom:-.28em;font-size:11rem;font-weight:800;line-height:1;color:var(--c);opacity:.12;pointer-events:none}
.rhero .name{font-size:clamp(1.9rem,5vw,2.6rem);margin:.3rem 0 .1rem;font-weight:800}
.rhero .alt2{color:var(--muted)}
.rhero .twing{display:inline-block;margin-top:.8rem;font-size:.9rem;font-weight:600;padding:.2rem .65rem;border-radius:6px;color:var(--c);background:color-mix(in srgb,var(--c) 14%,transparent)}
.rhero dl{display:grid;gap:.15rem;margin:1.2rem 0 0;position:relative;z-index:1}
.rhero dt{font-size:.82rem;color:var(--muted);margin-top:.5rem}
.rhero dd{margin:0}
.rhero .intro{margin:1.1rem 0 0;position:relative;z-index:1}
.rhero .quote{margin:1.4rem 0 0;font-size:1.15rem;font-weight:600;color:var(--c);position:relative;z-index:1}
.ractions{display:flex;flex-wrap:wrap;gap:.6rem;margin:0 0 2rem}
.stat{font-size:.92rem;color:var(--muted);margin:-1rem 0 1.6rem}
#test h2.sec{font-size:1.3rem;margin:0 0 1rem;font-weight:800}
.trows{display:grid;gap:.55rem;margin-bottom:1.6rem}
.trow2{display:grid;grid-template-columns:1.6rem minmax(0,9.5rem) 1fr 3rem;gap:.7rem;align-items:center;font-size:.93rem}
.trow2 .n{font-weight:800;color:var(--c)}
.trow2 .t{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.trow2 .track{height:10px;background:var(--rule);border-radius:99px;overflow:hidden}
.trow2 .track i{display:block;height:100%;background:var(--c);border-radius:99px}
.trow2 .p{text-align:right;font-variant-numeric:tabular-nums;color:var(--muted)}
.trow2.top .t{font-weight:600}
.tnote{font-size:.88rem;color:var(--muted);max-width:62ch}
.tnext{display:flex;flex-wrap:wrap;gap:.7rem;margin-top:1.5rem}

/* consult */
.cta{border:1.5px solid var(--ink);border-radius:18px;padding:1.5rem 1.6rem;display:grid;grid-template-columns:1fr auto;gap:1rem 2rem;align-items:center;background:var(--surface)}
.cta h3{font-size:1.25rem;font-weight:800;margin-bottom:.3rem}
.cta p{margin:0;color:var(--muted)}
@media (max-width:640px){.cta{grid-template-columns:1fr}}
#test .cta{margin:0 0 2rem}

/* guide hero + explorer */
header.hero{padding:3rem 0 1rem;border-top:1px solid var(--rule)}
.hero h1{font-size:clamp(2.6rem,7vw,4.6rem);font-weight:800;letter-spacing:-.01em;margin-top:.3rem}
.hero p{max-width:60ch;color:var(--muted);margin:.6rem 0 0}
.explorer{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:2rem;align-items:start;padding:1.5rem 0 3rem}
@media (max-width:860px){.explorer{grid-template-columns:1fr}}
@media (min-width:861px){.explorer > div:first-child{position:sticky;top:calc(env(safe-area-inset-top,0px) + 64px)}}
.modes{display:flex;flex-wrap:wrap;gap:.4rem;margin-bottom:.75rem}
.modes button{border:1px solid var(--rule);background:transparent;padding:.35rem .9rem;border-radius:999px;cursor:pointer;font-size:.92rem}
.modes button[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
svg#dia{width:100%;height:auto;display:block;max-width:600px;margin:0 auto}
#dia .ring{fill:none;stroke:var(--rule);stroke-width:1.5}
#dia .ln{stroke:var(--muted);stroke-width:1.2;opacity:.45;fill:none}
#dia .arr{stroke-width:2.4;fill:none}
#dia .arr.g{stroke:var(--growth)} #dia .arr.s{stroke:var(--stress)}
#dia .wingarc{fill:none;stroke:var(--ink);stroke-width:5;opacity:.18;stroke-linecap:round}
#dia .node{cursor:pointer}
#dia .node circle.dot{stroke:var(--paper);stroke-width:3}
#dia .node text.num{fill:#fff;font:800 20px "FiraGO",system-ui,sans-serif;text-anchor:middle;dominant-baseline:central;pointer-events:none}
#dia .node text.lbl{fill:var(--ink);font-size:13px;text-anchor:middle;dominant-baseline:central;pointer-events:none}
#dia .node .halo{fill:none;stroke:var(--ink);stroke-width:2;opacity:0}
#dia .node.sel .halo{opacity:1}
#dia .node.wing .halo{opacity:.55;stroke-dasharray:4 4}
#dia .node.fade{opacity:.35}
#dia .node:focus{outline:none}
#dia .node:focus-visible .halo{opacity:1;stroke-dasharray:2 3}
.legend{display:flex;flex-wrap:wrap;gap:1rem;justify-content:center;font-size:.85rem;color:var(--muted);margin-top:.5rem}
.legend span::before{content:"";display:inline-block;width:.7em;height:.7em;border-radius:50%;margin-right:.4em;vertical-align:middle;background:var(--c)}
.panel{background:var(--surface);border:1px solid var(--rule);border-radius:14px;padding:1.5rem 1.5rem 1.25rem}
.panel .top{display:flex;gap:1rem;align-items:center}
.panel .big{font:800 3.4rem/1 "FiraGO",system-ui,sans-serif;color:var(--c)}
.panel h2{font-size:1.6rem;font-weight:800}
.panel .en{display:block;font-size:1.05rem;margin-top:.1rem}
.panel .alt{color:var(--muted);font-size:.95rem}
.panel .center{display:inline-block;margin-top:.9rem;font-size:.85rem;padding:.15rem .6rem;border-radius:6px;background:color-mix(in srgb,var(--c) 15%,transparent);color:var(--c);font-weight:600}
.ptabs{display:flex;gap:.2rem;margin:1.1rem 0 1rem;border-bottom:1px solid var(--rule);overflow-x:auto}
.ptabs button{border:0;background:none;padding:.5rem .85rem;cursor:pointer;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap}
.ptabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--c);font-weight:600}
.kv{display:grid;grid-template-columns:1fr;gap:.1rem;margin:0}
.kv dt{color:var(--muted);font-size:.85rem;margin-top:.55rem}
.kv dt:first-child{margin-top:0}
.kv dd{margin:0}
h3.sub{font-size:1rem;font-weight:600;margin:1.3rem 0 .5rem}
.tags{display:flex;flex-wrap:wrap;gap:.35rem}
.tags span{font-size:.85rem;padding:.15rem .6rem;border-radius:999px;border:1px solid var(--rule);line-height:1.5}
.tags.pos span{color:var(--growth);border-color:color-mix(in srgb,var(--growth) 40%,transparent)}
.tags.neg span{color:var(--stress);border-color:color-mix(in srgb,var(--stress) 40%,transparent)}
.prose p{margin:0 0 .85rem;font-size:.97rem}
.prose p:last-child{margin-bottom:0}
.lvl{display:grid;gap:.5rem}
.lvl div{display:grid;grid-template-columns:6.5rem 1fr;gap:.8rem;font-size:.95rem;align-items:baseline}
.lvl b{font-size:.85rem}
.lvl .h b{color:var(--growth)} .lvl .a b{color:var(--muted)} .lvl .u b{color:var(--stress)}
.subs{display:grid;gap:.6rem}
.subs div{font-size:.95rem}
.subs b{display:block;font-size:.88rem}
.subs b span{color:var(--muted);font-weight:500}
ul.pr{margin:0;padding-left:1.1rem;font-size:.95rem}
ul.pr li{margin-bottom:.4rem}
.phrase{font-weight:600;color:var(--c);font-size:1.05rem;margin:0}
.rel{display:grid;gap:.7rem}
.rel h3{font-size:1.02rem;font-weight:600;margin-top:.4rem}
.chips{display:flex;flex-wrap:wrap;gap:.5rem}
.chip{border:1px solid var(--rule);background:var(--paper);border-radius:10px;padding:.45rem .7rem;cursor:pointer;text-align:left;font-size:.92rem;line-height:1.35}
.chip:hover{border-color:var(--ink)}
.move{display:flex;gap:.7rem;align-items:baseline;font-size:.95rem}
.move .tag{flex:none;font-weight:600;min-width:5.6em}
.move.g .tag{color:var(--growth)} .move.s .tag{color:var(--stress)}
.move button{border:0;background:none;padding:0;cursor:pointer;text-decoration:underline;text-underline-offset:3px;font-weight:600}
.faces{display:flex;flex-wrap:wrap;gap:.6rem 1.1rem}
.face{display:flex;align-items:center;gap:.5rem;font-size:.92rem;line-height:1.3}
.face i{flex:none;width:2.3rem;height:2.3rem;border-radius:50%;display:grid;place-items:center;font-style:normal;font-weight:600;background:color-mix(in srgb,var(--c) 16%,transparent);color:var(--c);border:1.5px solid color-mix(in srgb,var(--c) 45%,transparent)}
.hint{margin:0;font-size:.82rem;color:var(--muted)}

/* history */
ol.tl{list-style:none;margin:0;padding:0;max-width:760px;position:relative}
ol.tl::before{content:"";position:absolute;left:6.4rem;top:.5rem;bottom:.5rem;width:1px;background:var(--rule)}
ol.tl li{display:grid;grid-template-columns:5.6rem 1fr;gap:1.6rem;padding:0 0 1.8rem;position:relative}
ol.tl li::after{content:"";position:absolute;left:calc(6.4rem - 5px);top:.55rem;width:11px;height:11px;border-radius:50%;background:var(--paper);border:2px solid var(--ink)}
ol.tl time{font-weight:600;text-align:right;color:var(--muted);font-size:.95rem;padding-top:.1rem}
ol.tl h3{font-size:1.15rem;margin-bottom:.25rem;font-weight:800}
ol.tl p{margin:0;max-width:62ch}
@media (max-width:560px){ol.tl::before{left:.35rem} ol.tl li{grid-template-columns:1fr;gap:.2rem;padding-left:1.6rem} ol.tl li::after{left:0} ol.tl time{text-align:left}}
.note{max-width:66ch;font-size:.92rem;color:var(--muted);border-left:3px solid var(--rule);padding-left:1rem;margin-top:1rem}

/* types */
.centers{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:1.5rem}
@media (max-width:860px){.centers{grid-template-columns:1fr}}
.centers .col h3{font-size:1.15rem;color:var(--c);margin-bottom:.15rem;font-weight:800}
.centers .col > p{margin:0 0 .8rem;color:var(--muted);font-size:.92rem}
.trow{display:flex;gap:.9rem;align-items:flex-start;padding:.8rem 0;border:0;border-top:1px solid var(--rule);cursor:pointer;background:none;width:100%;text-align:left}
.trow:hover .tn{text-decoration:underline;text-underline-offset:3px}
.trow .n{font:800 1.9rem/1 "FiraGO",system-ui,sans-serif;color:var(--c);min-width:1.2em}
.trow .tn{font-weight:600}
.trow .ts{display:block;font-size:.9rem;color:var(--muted);line-height:1.45;margin-top:.15rem}
.trow .tf{display:block;font-size:.85rem;color:var(--c);margin-top:.25rem}

/* wings */
.wgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:1rem}
.wcell{border:1px solid var(--rule);border-radius:12px;padding:1rem;background:var(--surface)}
.wcell h3{font-size:1.05rem;margin-bottom:.5rem;font-weight:800}
.wcell h3 span{color:var(--c)}
.wcell dl{margin:0;display:grid;gap:.5rem}
.wcell dt{font-weight:600;font-size:.95rem}
.wcell dt code{font-family:inherit;color:var(--muted);font-weight:500;margin-right:.35rem}
.wcell dd{margin:0;font-size:.9rem;color:var(--muted);line-height:1.45}

/* moves */
.twocol{display:grid;grid-template-columns:1fr 1fr;gap:1.5rem;margin-bottom:2rem;max-width:900px}
@media (max-width:700px){.twocol{grid-template-columns:1fr}}
.twocol h3{font-size:1.15rem;margin-bottom:.3rem;font-weight:800}
.twocol .g h3{color:var(--growth)} .twocol .s h3{color:var(--stress)}
.twocol p{margin:0}
.tablewrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;min-width:640px;font-size:.93rem}
th,td{text-align:left;padding:.7rem .8rem;border-bottom:1px solid var(--rule);vertical-align:top}
th{font-weight:600;color:var(--muted)}
td.t{font-weight:600;white-space:nowrap}
td .to{font-weight:700;white-space:nowrap}
td.gc .to{color:var(--growth)} td.sc .to{color:var(--stress)}
.lines{display:flex;flex-wrap:wrap;gap:2rem;margin:0 0 2rem}
.lines div{font-size:1.3rem;font-weight:600}
.lines small{display:block;font-size:.85rem;color:var(--muted);font-weight:400}

/* subtypes */
.inst{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:1rem;margin-bottom:2rem}
@media (max-width:760px){.inst{grid-template-columns:1fr}}
.inst div{border:1px solid var(--rule);border-radius:12px;padding:1rem;background:var(--surface)}
.inst b{display:block;margin-bottom:.2rem}
.inst span{color:var(--muted);font-size:.92rem}
.sgrid{display:grid;gap:1rem}
.srow{display:grid;grid-template-columns:11rem repeat(3,minmax(0,1fr));gap:1rem;padding:1rem 0;border-top:1px solid var(--rule)}
.srow > h3{font-size:1.05rem;font-weight:800}
.srow > h3 span{color:var(--c);margin-right:.35rem}
.srow .c b{display:block;font-size:.9rem}
.srow .c b small{color:var(--muted);font-weight:500;font-size:.8rem;margin-right:.3rem}
.srow .c p{margin:.15rem 0 0;font-size:.9rem;color:var(--muted);line-height:1.45}
@media (max-width:860px){.srow{grid-template-columns:1fr;gap:.6rem}}

/* relations */
.pickers{display:flex;flex-wrap:wrap;gap:1rem;align-items:end;margin-bottom:1.5rem}
.pickers label{display:grid;gap:.3rem;font-size:.85rem;color:var(--muted)}
.pickers select{border:1.5px solid var(--rule);background:var(--surface);border-radius:10px;padding:.55rem .8rem;font-size:1rem;color:var(--ink);min-width:14rem}
.pickers .plus{font-size:1.6rem;font-weight:800;padding-bottom:.35rem}
.pair{display:grid;grid-template-columns:1fr 1fr;gap:1rem}
@media (max-width:700px){.pair{grid-template-columns:1fr}}
.pcard{border:1px solid var(--rule);border-top:4px solid var(--c);border-radius:12px;padding:1.1rem 1.2rem;background:var(--surface)}
.pcard h3{font-size:1.2rem;font-weight:800;margin-bottom:.6rem}
.pcard h3 span{color:var(--c)}
.pcard dl{margin:0;display:grid;gap:.1rem}
.pcard dt{font-size:.82rem;color:var(--muted);margin-top:.5rem}
.pcard dd{margin:0;font-size:.95rem}
.pnotes{margin:1.2rem 0 0;padding:0;list-style:none;display:grid;gap:.5rem;max-width:72ch}
.pnotes li{padding-left:1.4rem;position:relative}
.pnotes li::before{content:"✦";position:absolute;left:0;color:var(--muted)}

/* practice */
.prgrid{display:block}
.phr ol{grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:1rem 2rem!important}
@media (max-width:860px){.prgrid{grid-template-columns:1fr}}
.med h3,.phr h3{font-size:1.2rem;font-weight:800;margin-bottom:1rem}
.med p{margin:0 0 1rem;max-width:62ch}
.phr ol{list-style:none;margin:0;padding:0;display:grid;gap:.8rem}
.phr li{display:grid;grid-template-columns:2rem 1fr;gap:.6rem;align-items:baseline}
.phr li b{font-size:1.4rem;color:var(--c);font-weight:800}
.phr li small{display:block;color:var(--muted);font-size:.82rem}

footer{border-top:1px solid var(--rule);padding:2rem 0 3rem;color:var(--muted);font-size:.9rem}
footer p{max-width:70ch;margin:0}
footer .copy{margin-top:1rem;color:var(--ink)}
footer .social{display:inline-flex;align-items:center;gap:.55rem;margin-top:1.4rem;padding:.5rem .9rem .5rem .7rem;border:1.5px solid var(--rule);border-radius:999px;color:var(--ink);text-decoration:none;font-size:.95rem}
footer .social:hover{border-color:var(--ink)}
footer .social b{font-weight:600}

/* modal */
.modal{position:fixed;inset:0;z-index:20;background:rgba(10,12,28,.6);display:grid;place-items:center;padding:1rem}
.modal .box{background:var(--surface);border-radius:16px;padding:1.2rem;max-width:400px;width:100%;max-height:100%;overflow:auto;display:grid;gap:.9rem;justify-items:center}
.modal img{width:100%;max-width:300px;height:auto;border-radius:10px;box-shadow:0 6px 24px rgba(0,0,0,.25)}
.modal .row{display:flex;gap:.6rem;flex-wrap:wrap;justify-content:center}
.modal h3{font-weight:800}
