ერბურგში ასწავლიდა. 1919 წელს თბილისში დააარსა „ადამიანის ჰარმონიული განვითარების ინსტიტუტი“, შემდეგ კი საფრანგეთში გადავიდა. მისთვის სიმბოლო კოსმოსური პროცესების რუკა იყო და არა პიროვნების ტიპოლოგია."], ["1950–1960-იანი", "ოსკარ იჩაზო", "ბოლივიელმა მასწავლებელმა სიმბოლოს „ეგოს ფიქსაციები“ და „ვნებები“ მიუსადაგა — სწორედ აქედან იწყება ცხრა ტიპის იდეა. 1968 წელს ჩილეში, არიკაში, საკუთარი სკოლა დააარსა."], ["1970-იანი", "კლაუდიო ნარანჰო", "ჩილელმა ფსიქიატრმა იჩაზოს სქემა თანამედროვე ფსიქოლოგიის ენაზე გადაიტანა და აშშ-ში, კალიფორნიაში, ასწავლიდა. მან აღწერა 27 ინსტინქტური ქვეტიპიც. მისი მოსწავლეების მეშვეობით სისტემა იეზუიტურ წრეებშიც გავრცელდა."]]}, "med": ["მოკალათდი ისე, რომ სხეულს არაფერი უშლიდეს ხელს. ფეხები მიწაზე დადგი, ხელები მუხლებზე დაასვენე. თუ გინდა, თვალები დახუჭე.", "ღრმად ჩაისუნთქე… და ნელა ამოისუნთქე. (პაუზა) კიდევ ერთხელ. იგრძენი, როგორ ეშვება მხრები ამოსუნთქვისას. (პაუზა)", "ახლა ყურადღება სამ ცენტრზე გაატარე. ჯერ მუცელზე: აქ ცხოვრობს შენი ძალა, საზღვრები და „არა“-ს თქმის უნარი. უბრალოდ შეამჩნიე, რას გრძნობ იქ. (პაუზა) მერე გულზე: აქ ცხოვრობს სურვილი, რომ დაგინახონ და გიყვარდეს. რა ხდება ახლა იქ? (პაუზა) ბოლოს თავზე: აქ ცხოვრობს ფიქრი, დაგეგმვა, უსაფრთხოების ძიება. შეამჩნიე, რამდენად ხმაურიანია ან მშვიდი. (პაუზა)", "ახლა წარმოიდგინე, რომ შენი ტიპი ადამიანის სახით შემოდის ოთახში და შენ წინ ჯდება. ის ყოველთვის შენთან იყო და ცდილობდა შენს დაცვას. შეხედე მას. როგორია მისი სახე? დაღლილია? მოუსვენარი? (პაუზა)", "ჰკითხე მას ჩუმად: „რისი გეშინია ყველაზე მეტად?“ და მოუსმინე. პასუხი შეიძლება სიტყვით მოვიდეს, სურათით ან უბრალოდ შეგრძნებით. (პაუზა) ახლა ჰკითხე: „რა გჭირდება სინამდვილეში?“ (პაუზა)", "მადლობა გადაუხადე, რომ ამდენი ხანი ცდილობდა შენს დაცვას. შემდეგ უთხარი ის სიტყვები, რომლებიც მას ყველაზე მეტად სჭირდება — შენი ტიპის ფრაზა ქვემოთაა. გაიმეორე სამჯერ, ყოველ ამოსუნთქვაზე ერთხელ. (პაუზა)", "წარმოიდგინე, როგორ იცვლება შენი ტიპის სახე ამ სიტყვების მოსმენისას. შეიძლება გაიღიმოს, შეიძლება შვებით ამოისუნთქოს. შეამჩნიე, სად გრძნობ ამ ცვლილებას საკუთარ სხეულში. (პაუზა)", "ბოლოს წარმოიდგინე, რომ ის ახლოს მოდის და შენში ბრუნდება — აღარა როგორც მცველი, არამედ როგორც შენი დასვენებული ნაწილი. ღრმად ჩაისუნთქე… ამოისუნთქე. ნელა დაამოძრავე თითები, იგრძენი ფეხები მიწაზე და, როცა მზად იქნები, თვალები გაახილე."]}, "en": {"ui": {"guide": "Explore your type in the guide ↓", "title": "Enneagram Test", "eyebrow": "Enneagram test", "h1": "Discover your type", "intro": "Read each statement and mark how well it describes you. Think not about who you’d like to be, but about who you really are — especially across most of your adult life.", "short": "Short test", "shortSub": "27 statements · about 5 minutes", "full": "Full test", "fullSub": "54 statements · about 10 minutes", "tip": "Each time, the statements are generated in a new random order. The short test randomly picks three statements per type from the bank.", "back": "← Back", "keys": "Keyboard: 1–5", "res": "Your result", "type": "Enneatype", "also": "also", "need": "Core need", "fear": "Core fear", "want": "Core desire", "motive": "Core motivation", "scores": "Scores for all types", "note": "The test only points you in a direction. In the Enneagram, you ultimately recognise your own type: read the descriptions of your top two or three types and consider whose fear and desire feel most familiar.", "again": "Generate a new test", "wing": "Likely wing", "wingOr": "Wing: {a} or {b}", "tie": "Your top two types ({a} and {b}) are almost equal — read both descriptions carefully.", "next": "Second place: type {a} ({an}); third: type {b} ({bn}).", "ql": "“", "qr": "”", "n_test": "Test", "n_guide": "Guide", "n_history": "History", "n_types": "Types", "n_wings": "Wings", "n_moves": "Movement", "n_sub": "Subtypes", "n_rel": "Relationships", "n_prac": "Practice", "g_eyebrow": "Interactive guide", "g_title": "Enneagram", "g_lead": "A nine-pointed symbol and nine personality types. Tap any number on the diagram, then switch modes to see its wings and its directions of growth and stress.", "m_lines": "Lines", "m_wings": "Wings", "m_moves": "Growth & stress", "lg_gut": "Instinctive centre", "lg_heart": "Emotional centre", "lg_head": "Intellectual centre", "lg_growth": "Direction of growth", "lg_stress": "Direction of stress", "dia_label": "Enneagram diagram with nine types", "tab_profile": "Profile", "tab_dev": "Growth", "tab_links": "Connections", "pos": "Strengths", "neg": "Weaknesses", "more": "In depth", "gs_title": "Growth and stress", "growth_arrow": "Growth →", "stress_arrow": "Stress →", "wings_t": "Wings", "famous_t": "Famous people", "famous_hint": "Their types were assigned by Enneagram authors based on biography — this is an assumption, not a fact.", "levels_t": "Levels of development", "lv": ["Healthy", "Average", "Unhealthy"], "sub_t": "Instinctual subtypes", "prac_t": "Daily practice", "phrase_t": "A phrase for you", "h_history": "A short history", "h_types": "The nine types", "types_lead": "The types fall into three centres, depending on where a person mostly “lives” and which emotion drives them. Tap a type to see it on the diagram.", "center_emo": "Core emotion", "h_wings": "Wings", "wings_lead": "A wing is a neighbouring type on the circle whose traits “colour” the core type. Every type has two possible wings — a Four, for example, has a Three or a Five. The notation 4w5 means “a Four with a Five wing”. Usually one wing is stronger, though both can show up.", "h_moves": "Movement: growth and stress", "moves_lead": "The inner lines of the diagram show how a type changes in different states. Each number is connected to two others: it moves in one direction in growth (integration) and in the other under stress (disintegration).", "growth_h": "Growth (integration)", "growth_p": "When a person feels calm and safe, they take on the healthy traits of another type — as if filling in what was missing.", "stress_h": "Stress (disintegration)", "stress_p": "Under pressure, a person starts showing the unhealthy habits of another type. This is not “bad” — it is a signal that something needs attention.", "line_hex": "Hexad, in the direction of stress (growth runs in reverse)", "line_tri": "Triangle, in the direction of stress (growth runs in reverse)", "th_type": "Type", "th_growth": "In growth", "th_stress": "Under stress", "moves_note": "Some contemporary teachers believe both directions have healthy and unhealthy sides, so treat this scheme as a tendency, not a rule.", "h_sub": "Instinctual subtypes", "sub_lead": "Everyone has three instincts, but one is usually dominant. Type and dominant instinct together create 27 subtypes. The descriptions follow Claudio Naranjo’s tradition.", "inst": {"sp": ["Self-preservation (SP)", "Body, safety, resources, comfort, health."], "so": ["Social (SO)", "Group, belonging, role and status in society."], "sx": ["One-to-one (SX)", "Intensity, attraction, deep connection with one person."]}, "h_rel": "Types in relationships", "rel_lead": "Choose two types — yours and that of a partner, friend or colleague — and see what they give each other, what they need and how they behave in conflict.", "rel_a": "First type", "rel_b": "Second type", "rel_gift": "Brings", "rel_need": "Needs", "rel_conf": "In conflict", "rel_same": "The same type: you understand each other very well, but you also share the same blind spots — try to follow each other’s direction of growth.", "rel_center": "You both belong to the same centre ({c}), so you share a similar core emotion — {e}.", "rel_wing": "You are neighbours on the circle, so you are each other’s wings and will find a lot in common.", "rel_growth": "In growth, {a} takes on the healthy traits of {b} — {bn} can be an inspiration.", "rel_stress": "Under stress, {a} shows the unhealthy traits of {b} — this may be especially noticeable in this relationship.", "rel_tip": "Any pair can be happy — what matters is that each knows what the other needs.", "h_prac": "Practice", "prac_lead": "The phrases each type most needs to hear.", "med_t": "Meditation: meeting your type", "phrases_t": "Phrases for each type", "foot_note": "The Enneagram is a tool for self-reflection, not a diagnosis. People recognise their type best themselves — by the motivation and fear behind their behaviour, not by behaviour alone.", "cta_t": "Want to understand your type more deeply?", "cta_p": "In a one-to-one consultation we’ll explore your type, wing, subtype and paths of growth together.", "cta_btn": "Book a consultation", "share_btn": "Create a story card", "share_t": "Your result card", "share_save": "Save image", "share_hint": "If the button doesn’t work, long-press the image to save it.", "share_close": "Close", "card_top": "My Enneatype", "card_bottom": "Take the test", "stats_line": "{p}% of people who took this test are also type {n} ({t} results in total).", "tb_eyebrow": "Refining", "tb_t": "Two types are very close", "tb_p": "Your top two types scored almost the same. In four pairs, choose the statement that describes you more accurately.", "tb_round": "{i} / {n}", "tb_note": "Your result was refined with extra questions.", "title_page": "Enneagram — test and interactive guide"}, "lbl": ["Strongly disagree", "Disagree", "Somewhat", "Agree", "Strongly agree"], "q": {"1": ["I often notice what’s wrong and how it could be fixed.", "I find it hard to relax until a task is finished completely and correctly.", "I often hear the voice of an inner critic in my head.", "It irritates me when people break the rules or act irresponsibly.", "It matters to me that everything is done properly and honestly.", "I often hold back my anger because I feel expressing it is wrong."], "2": ["I easily sense what others need, often before they do.", "I find it hard to say no when someone needs my help.", "It’s important to me that people need me.", "It hurts when my care goes unnoticed or unappreciated.", "Talking about my own needs is hard; talking about other people’s is easy.", "Relationships and closeness are at the centre of my life."], "3": ["Achieving goals gives me energy and a sense of my own worth.", "I know how to present myself well in different settings.", "Failure is one of the hardest feelings for me.", "I often put my feelings aside to get things done.", "How others view my success matters to me.", "I love competing and being the best."], "4": ["I often feel different from others and not fully understood.", "My emotions are very deep and intense.", "I’m drawn to melancholy, nostalgia and what has been lost.", "It matters to me that my life and surroundings express my uniqueness.", "Sometimes I envy people who seem to have what I lack.", "Ordinariness and superficiality weigh me down."], "5": ["Before getting involved in something, I prefer to study it thoroughly.", "I need a lot of personal space and time alone.", "Long stretches with people drain my energy.", "Knowledge and competence are my source of security.", "I process emotions with my mind first and only feel them later.", "I dislike it when people demand a lot from me — time, energy, attention."], "6": ["I often think ahead about what could go wrong.", "I’m deeply loyal to the people I trust.", "Before making a decision, I often ask others for their opinion.", "I’m wary of new people and situations at first.", "I feel calm when I know I have reliable support.", "I often doubt myself, yet in a crisis I act courageously."], "7": ["I always have lots of plans and ideas.", "Boredom and restriction are unbearable to me.", "When something hurts, I try to switch quickly to something pleasant.", "I love new experiences, travel and novelty.", "I find it hard to focus on one thing for long.", "I’m an optimist and look for the positive in every situation."], "8": ["I say what I think directly, even if others don’t like it.", "I don’t like it when someone tries to control me.", "I find it hard to show weakness.", "When I see injustice, I step in right away and protect the weak.", "I’m not afraid of conflict; sometimes it even energises me.", "I naturally take on the leader’s role."], "9": ["I avoid conflict and seek harmony.", "I easily see every side’s point of view.", "I often go along with what others want so as not to disturb the peace.", "I struggle to focus on what matters most — I get easily absorbed in small things.", "Sometimes I don’t even know what I want.", "I love comfort, routine and a calm environment."]}, "types": {"1": {"name": "The Reformer", "alt": "Idealist, Perfectionist", "need": "To be perfect, idealistic.", "fear": "Being dishonest or bad; having flaws.", "want": "To be good, fair and balanced.", "motive": "Wants to be right, to strive and improve everything, to live up to their ideals, to justify themselves and to be beyond anyone’s criticism or judgement.", "pos": ["ethical", "reliable", "productive", "prudent", "idealistic", "honest", "decent", "loves cleanliness", "disciplined"], "neg": ["rigid", "categorical", "critical of others", "overly serious", "controlling", "worried", "jealous"], "body": ["The One’s deepest drive is anger. Ones are angry because the world is imperfect.", "Type 1 belongs to the body centre: rational, principled, purposeful, self-controlled and perfectionistic, conscientious and ethical, with a strong sense of right and wrong.", "Ones are well organised, orderly and hard-working. They try to maintain high standards, but they can also become critics.", "They are teachers and advocates of change: always trying to improve everything, yet afraid of making mistakes.", "A One’s life is governed by the pursuit of perfection. They are keenly aware of their responsibilities and obligations and are often very punctual. They are serious people who rarely joke, and they allow themselves to rest only once their work is completely finished.", "Ones usually struggle with dissatisfaction and impatience. They tend to judge and punish themselves, and to suppress and destroy their own desires.", "At their best, Ones become discerning, realistic and noble, humane and inspiring, acting in the best possible way."], "d": "Principled, purposeful and self-controlled. Sees clearly how the world “should be” and tries to improve it.", "gt": "The inner critic quietens — lightness, spontaneity and joy appear.", "st": "Becomes melancholic, feels misunderstood and lonely.", "aff": "You are already good. You can rest.", "fam": ["Mahatma Gandhi", "Confucius", "Joan of Arc"], "levels": ["Wise and realistic: accepts imperfection, acts calmly and fairly, inspires others.", "Orderly and demanding: judges everything by how it “should be”, often criticises themselves and others.", "Intolerant and harsh: sees only mistakes, becomes dogmatic, prone to self-punishment and punishing others."], "sub": {"sp": ["“Worry”", "The most restrained One; seeks security through precision and planning, constantly worried that something will go wrong."], "so": ["“Role model”", "Feels they must be an example of right behaviour; takes the teacher’s role and knows “how it is done properly”."], "sx": ["“Zeal”", "The most openly angry One; tries to fix other people and the world — a fighting reformer."]}, "prac": ["When the inner critic switches on, ask yourself: what does “good enough” mean in this situation?", "Every day, do one thing purely for pleasure, with no outcome.", "Notice anger in your body — jaw, shoulders — and name it before it turns into criticism."], "rel": ["Reliability, honesty, stability and care for detail.", "Recognition that they are trying; lightness and humour; criticism delivered gently.", "Becomes critical, holds back anger and insists on what is “right”."], "fc": ["What I fear most is acting wrongly or badly.", "What I want most is to be good and fair.", "My attention automatically goes to mistakes and what could be improved.", "Under stress I become more critical and strict."]}, "2": {"name": "The Helper", "alt": "Altruist", "need": "To be needed.", "fear": "Being unneeded, useless, unworthy of love.", "want": "To feel loved.", "motive": "Twos want to be loved and appreciated, and to express warmth and positive feelings toward people.", "pos": ["loving", "caring", "adaptable", "perceptive", "generous", "inspiring", "warmly attuned to others’ feelings"], "neg": ["suffering", "aggrieved", "manipulative", "possessive", "hysterical", "overprotective"], "body": ["Type 2 belongs to the heart centre: caring, relationship-oriented, possessive, generous and demonstrative. Twos love to please people. They use their gifts to meet others’ needs and to care for their health, nourishment, education and well-being.", "Twos can cry easily because they are sensitive and emotional. They are “teddy bears” who love hugs and affection. A Two loves talking about relationships and love. They long to be loved wholeheartedly and to be allowed to live for the people they love.", "Twos usually have a wide circle of acquaintances and friends, and want to be especially important to their friends.", "The love and care they feel, and the genuine kindness they show, make them feel valuable. For a Two, what matters most in life is love, communication, family and friendship.", "When a Two is healthy and balanced, they are truly loving, generous and attentive. They draw people in like honey draws bees.", "Healthy Twos bring others to life with their gratitude and attention, helping people see positive qualities in themselves that they had not recognised before."], "d": "Warm, generous and attentive; easily senses and meets others’ needs.", "gt": "Turns attention back to their own feelings — becomes authentic with themselves.", "st": "Feeling ignored turns into anger — becomes demanding and controlling.", "aff": "You are loved for who you are, not only for what you do.", "fam": ["Mother Teresa", "Desmond Tutu", "Dolly Parton"], "levels": ["Selfless and truly loving: helps without expectations and honours their own needs too.", "People-pleasing and involved: tries to earn love through care, struggles to say no, secretly expects gratitude.", "Manipulative and demanding: turns care into debt, feels like a victim and blames others."], "sub": {"sp": ["“Privilege”", "More childlike and charming; asks for care for themselves too, more cautious and less giving."], "so": ["“Ambition”", "A strong, leader-like Two; influential in groups, gains position and importance through helping."], "sx": ["“Seduction”", "The most passionate Two; seeks love from one particular person, wins them over with attractiveness and devotion."]}, "prac": ["Before offering help, ask yourself: “What do I need right now?”", "Practise saying no to small requests, without apologising.", "At the end of the day, write down one thing you did for yourself."], "rel": ["Warmth, attention, care and emotional support.", "Gratitude, expressions of love and having their own needs noticed.", "Feels unappreciated, gets hurt and sometimes blames."], "fc": ["What I fear most is that no one needs or loves me.", "What I want most is to feel loved.", "My attention automatically goes to other people’s needs.", "Under stress I feel hurt that my care isn’t appreciated."]}, "3": {"name": "The Motivator", "alt": "Achiever", "need": "To be successful.", "fear": "Being worthless, useless.", "want": "To feel valued and worthwhile.", "motive": "Wants to be accomplished, to stand out from others, to be the centre of attention, to impress and inspire admiration.", "pos": ["optimistic", "self-confident", "diligent", "effective", "goal-driven", "energetic", "practical"], "neg": ["deceitful", "narcissistic", "arrogant", "superficial", "vindictive", "overly competitive"], "body": ["Type 3 belongs to the heart centre. Threes are self-assured, driven, attractive and charming. They are ambitious, competent and energetic, and status matters to them. They are diplomatic and poised, yet can worry too much about what others think of them. At their best, they accept themselves and are authentic, admirable role models for others.", "The Three’s special gift lies in lightness and self-confidence, which inspire trust. This allows them to create a pleasant atmosphere around them.", "They get things done lightly and efficiently, inspiring others along the way. Threes work very hard and are highly competent at what they do. They draw energy from their own success. Threes walk around smiling, and whatever they wish for will surely be theirs.", "The Three’s defence mechanisms are masks and lies. Threes protect themselves from life’s dangers by burying themselves in projects. Nothing is sadder to see than an unsuccessful Three, because nothing is more terrible to them than failure. They cannot bear defeat.", "The Three’s key quality, the opposite of their deep motive, is truthfulness and honesty. Threes find their way to their hidden strengths only after walking the painful path of self-discovery: facing their own lies, big and small, and refusing to cover them up."], "d": "Energetic, adaptable and goal-oriented; knows how to present themselves.", "gt": "Loyalty and cooperation instead of image — creates value for the team.", "st": "Loses energy — apathy, procrastination, “switching off”.", "aff": "Your worth is greater than your achievements.", "fam": ["Oprah Winfrey", "Tom Cruise", "Taylor Swift"], "levels": ["Authentic and inspiring: links success to their own values and helps others grow.", "Image-focused and competitive: measures themselves by achievements, puts feelings aside.", "False and cold: does everything for the appearance of success, ready to deceive, while feeling empty inside."], "sub": {"sp": ["“Security”", "The modest Three; works hard and efficiently but dislikes boasting — wants to be “good”, not just successful."], "so": ["“Prestige”", "The most typical Three; status, recognition and climbing the social ladder matter greatly."], "sx": ["“Attractiveness”", "Creates success for loved ones — partner, family, team; tries to be desirable and attractive."]}, "prac": ["Once a day, stop and ask: “What am I feeling right now?” — not “What am I doing?”", "Share a failure or weakness with someone close and notice that love does not disappear.", "Set aside time when you achieve nothing — you simply are."], "rel": ["Energy, motivation, organisation and achieving goals together.", "Being admired as a person, not only for their success.", "Escapes into work, puts feelings aside, switches into “everything’s fine” mode."], "fc": ["What I fear most is turning out worthless and unsuccessful.", "What I want most is to be valued and recognised.", "My attention automatically goes to goals and results.", "Under stress I work even harder and switch off my feelings."]}, "4": {"name": "The Romantic", "alt": "Individualist", "need": "To be different, to stand out from others.", "fear": "Not standing out; being insignificant.", "want": "To find themselves and their significance, to create their own identity.", "motive": "To live through feelings and be understood by others; driven by the search for meaning and the wish not to be like everyone else, not to be ordinary.", "pos": ["creative", "highly intuitive", "supportive", "compassionate", "expressive"], "neg": ["depressive", "shy", "suffers from feelings of inadequacy", "moralising", "withdrawn", "stubborn", "melancholic", "self-absorbed"], "body": ["Type 4 belongs to the heart centre. Fours use their gifts to awaken a sense of beauty and harmony around them. They are highly sensitive and often artists, expressing their feelings through dance, music, painting, theatre or literature.", "They are drawn to everything that holds life energy, and they sense other people’s moods and emotions well.", "The Four is oriented toward individuality: refined, changeable, sensitive and mysterious. They draw energy from others. Their life questions are: “What do you think of me? Will you notice me? Will you pay attention to me?” They try to be attractive, distinctive and creative, and sometimes eccentric and extravagant.", "Fours constantly feel that reality is unbearable and meaningless. This is often linked to a real or emotional painful loss.", "Fours are easy to recognise visually. They dress in a striking, provocative way, often in black and purple. Fours are vegetarians, animal-rights advocates, feminists and representatives of other alternative movements.", "The Four’s particular defence mechanism is dramatisation. They express feelings not directly but indirectly, through symbols and rituals. Many Fours love long evening conversations over a cup of tea or a glass of wine.", "By the age of 25, a Four has already experienced almost every emotion, from agony to ecstasy. They know the depth of feelings and understand people better than others. A healthy Four can feel extremely deeply, in a way many of us cannot."], "d": "Emotionally deep, creative and focused on self-knowledge.", "gt": "Moves from emotion to action — discipline and principle appear.", "st": "Becomes people-pleasing and dependent on others’ attention.", "aff": "You are already whole. Nothing is missing.", "fam": ["Virginia Woolf", "Frida Kahlo", "Bob Dylan"], "levels": ["Creative and sincere: turns pain into art and compassion, calmly accepts themselves.", "Sensitive and self-absorbed: compares themselves with others, retreats into fantasies and moods.", "Despairing and self-destructive: sinks into shame and depression, feels hopeless."], "sub": {"sp": ["“Tenacity”", "Carries pain silently without showing it; a resilient, enduring and less dramatic Four."], "so": ["“Shame”", "Compares themselves with others most, feels lesser; expresses sorrow openly."], "sx": ["“Competition”", "The most intense Four; envy turns into anger and competition, demanding and passionate."]}, "prac": ["Write down three things you have now and are grateful for — not what you lack.", "When emotion overwhelms you, ask: “What small step can I take?”", "Notice moments of comparison and return to your own path."], "rel": ["Depth, authenticity, emotional honesty and beauty.", "To have their feelings seen and understood, without anyone “fixing” them.", "Withdraws, dramatises or feels misunderstood and abandoned."], "fc": ["What I fear most is having no identity or significance of my own.", "What I want most is to find myself and be authentic.", "My attention automatically goes to what I lack or what has been lost.", "Under stress I withdraw into my feelings and feel misunderstood."]}, "5": {"name": "The Observer", "alt": "Thinker, Expert", "need": "To understand. Oriented toward logic and analysis; innovative.", "fear": "Being useless, helpless, incompetent.", "want": "To be capable and competent.", "motive": "Wants to know everything and to be independent, so as never to look foolish.", "pos": ["analytical", "sensitive", "wise", "objective", "perceptive", "self-sufficient"], "neg": ["intellectually arrogant", "stingy", "stubborn", "detached", "critical", "reserved", "unfriendly"], "body": ["The Five’s special gift is openness to new facts and impressions. Fives are discoverers of new ideas — researchers and inventors fascinated by studying things in detail.", "They think originally, provocatively, differently and deeply. Fives are attentive and good listeners. The Five is emotional, loving, courteous, hospitable and noble.", "Fives feel emptiness and anxiety, which they try to fill by acquiring knowledge.", "Fives are often collectors. They need private, protected personal space where no one watches them and where they can think in peace.", "Fives often wear glasses. Their eyesight often deteriorates even before the age of 20.", "As a rule, Fives try to avoid anything that might draw attention to them. Many Fives hate words like “sharing” or “teamwork”, because they do not feel comfortable in a team.", "For a Five, knowledge is power. They believe they can protect themselves by knowing as much as possible about everything.", "One defence mechanism Fives like to use is detachment. Nothing frightens Fives as much as emotional involvement."], "d": "Curious, analytical and independent; careful with time and energy.", "gt": "From knowledge to action — becomes confident and decisive.", "st": "Scatters — becomes restless and impulsive.", "aff": "You have enough. You can step into life.", "fam": ["Albert Einstein", "Bill Gates", "Jane Goodall"], "levels": ["Wise and visionary: shares deep knowledge with the world, takes part in life rather than only observing.", "Withdrawn and analytical: lives in ideas, guards time and energy, avoids emotional closeness.", "Isolated and nihilistic: cuts off from people completely, becomes suspicious and sees the world as hostile."], "sub": {"sp": ["“Castle”", "The most withdrawn Five; strongly guards space, time and resources, lives with minimal needs."], "so": ["“Totem”", "Drawn to expertise and ideas; connects with like-minded people through knowledge."], "sx": ["“Confidence”", "The most emotional Five; seeks an ideal, deep bond with one person they can trust completely."]}, "prac": ["Share a feeling with someone, not just a thought.", "Act before you “know enough” — knowledge deepens through practice.", "Exercise, dance or walking will bring you from your head back into your body."], "rel": ["Calm, loyalty, deep interest and wise advice.", "Personal space, time and knowing in advance what to expect.", "Shuts down, takes distance and does not show emotions."], "fc": ["What I fear most is turning out incapable and useless.", "What I want most is to be competent and to understand the world.", "My attention automatically goes to observing and analysing.", "Under stress I pull away from people and retreat into my mind."]}, "6": {"name": "The Skeptic", "alt": "Loyalist, Realist", "need": "Security.", "fear": "Being left without support and guidance.", "want": "To be safe through the support of others.", "motive": "The need for security.", "pos": ["loyal", "caring", "warm", "compassionate", "witty", "practical", "helpful", "responsible"], "neg": ["overly cautious", "controlling", "unpredictable", "judgemental", "paranoid", "always on the defensive", "heavy", "easily irritated", "pessimistic"], "body": ["Sixes have an incredible gift: they are wonderful team players. In relationships they are deeply loyal, and in friendship warm and profound. For those they love, they will do anything and give everything they can.", "Sixes easily find a way out of any difficult situation. They readily doubt themselves and constantly sense danger. The Six has their own view of the world: “The world is full of danger; you must always be on guard.” Phobic Sixes are very distrustful.", "The Six’s temptation lies in the pursuit of security. That is why they like closed systems, restricted access and “secret societies”. These give them the feeling of belonging to an “upper class”, a “select circle”.", "Less developed Sixes seek hierarchy, authority and security, then become dependent and feel dissatisfied again.", "The Six’s defence mechanism is projection. They always expect the worst. Their distrust breeds hostility, resentment and negative thoughts about other people. The Six’s deep motive is fear and anxiety.", "Sixes avoid inappropriate behaviour and make sure everyone follows the established rules.", "The Six’s strength lies in courage. In moments of crisis, a Six can overcome fear far more easily than any other type.", "A Six is destined to wrestle with fear all their life. Hard physical exercise relieves the weight of this anxiety. The Six’s additional gift is a well-developed intuition."], "d": "Responsible, vigilant and team-oriented; foresees risks.", "gt": "Anxiety settles — inner calm and trust appear.", "st": "Tries to be flawless and efficient — becomes competitive and image-focused.", "aff": "You can trust yourself. You are your own support.", "fam": ["Tom Hanks", "Marilyn Monroe", "Julia Roberts"], "levels": ["Courageous and reliable: trusts themselves, creates stability for others, acts with courage.", "Loyal but anxious: seeks authority and guarantees, hesitates, doubts everything.", "Paranoid and reactive: sees danger everywhere, fights “enemies” or falls into panic."], "sub": {"sp": ["“Warmth”", "The most anxious, “phobic” Six; seeks security through warm, friendly relationships."], "so": ["“Duty”", "Seeks security in rules, systems and authority; precise, responsible and principled."], "sx": ["“Strength”", "The “counterphobic” Six; fights fear with attack and boldness, may look like an Eight from outside."]}, "prac": ["When anxious, separate: what is fact, and what is assumption?", "Write down times you trusted your own judgement and things turned out well.", "Physical exercise reduces anxious energy — train regularly."], "rel": ["Loyalty, solidarity, humour and dependability.", "Trust, clarity, stability and having their fears taken seriously.", "Becomes suspicious, asks many questions, sometimes attacks defensively."], "fc": ["What I fear most is being left without support or something to rely on.", "What I want most is to feel safe and stable.", "My attention automatically goes to possible dangers and risks.", "Under stress my anxiety grows and I doubt many things."]}, "7": {"name": "The Enthusiast", "alt": "Adventurer", "need": "To escape pain.", "fear": "Losing something important and feeling pain.", "want": "To be satisfied, with absolutely all needs fulfilled.", "motive": "Sevens are driven by a sense that happiness is essential; they plan enjoyable activities to contribute to the world and to avoid suffering and pain.", "pos": ["loving", "spontaneous", "imaginative", "productive", "enthusiastic", "quick", "self-confident", "charming", "curious"], "neg": ["self-centred", "impulsive", "unfocused", "rebellious", "undisciplined", "possessive", "manic", "self-destructive", "restless"], "body": ["The Seven’s pursuit of happiness often turns into a manic escape from life.", "Sevens are people who radiate joy and optimism. They are full of good humour, creative, cheerful, lively and charming — until one fine day they notice that all of this also serves to protect them from anxiety and pain.", "The Seven is curious. It seems that what they have or already know is never enough. They need change, stimulation and new experiences. They always have “several irons in the fire”, keeping escape routes open and avoiding strong attachment to anything or anyone.", "They rarely stay in the same job for long. They are interested in doing several exciting things at once.", "The Seven’s temptation is idealism. They need to be sure they are working toward a good goal that brings joy to themselves and others.", "Sevens avoid pain. Their method is remarkably simple: “I want to be cheerful, not sad. I want to enjoy life.” They are unhappy when others are unhappy. There must be a pleasant atmosphere around them.", "A Seven can overdo everything: eating, drinking, working, taking on more projects, seeking more recognition, a better place to live.", "Sevens are gifted with a sense of joy that they carry to people."], "d": "Optimistic, energetic and versatile; always looking for new possibilities.", "gt": "Slows down and deepens — focus, silence and contemplation appear.", "st": "Becomes critical, impatient and harsh.", "aff": "Here, in this moment, you have everything you need.", "fam": ["Wolfgang Amadeus Mozart", "Robin Williams", "Jim Carrey"], "levels": ["Grateful and deeply joyful: enjoys what they have, stays focused and shares joy with others.", "Restless and scattered: constantly seeks new experiences, changes plans, avoids pain.", "Impulsive and self-destructive: sinks into excess, runs from everything and cannot stop."], "sub": {"sp": ["“Keepers of the castle”", "A practical, entrepreneurial Seven; builds networks and opportunities so nothing is lacking."], "so": ["“Sacrifice”", "An idealistic Seven; sacrifices their own wishes for others and a better world."], "sx": ["“Fascination”", "A dreamer Seven; idealises everything, lives in fantasy and is easily captivated by a new person or idea."]}, "prac": ["When you want to escape, stay for five minutes with the feeling you are running from.", "Finish one thing you started before beginning something new.", "Spend a few minutes every day in silence, doing nothing."], "rel": ["Fun, optimism, adventure and new possibilities.", "Freedom and shared joy rather than restriction.", "Changes the subject, deflects with jokes or simply “disappears”."], "fc": ["What I fear most is being trapped in pain or restriction.", "What I want most is to be free and happy.", "My attention automatically goes to new possibilities and pleasures.", "Under stress I escape into new plans and fun."]}, "8": {"name": "The Boss", "alt": "Leader, Challenger", "need": "To resist.", "fear": "Being harmed or controlled by someone.", "want": "To protect themselves (to control their life and destiny).", "motive": "Eights are driven to be self-confident and strong, and to escape feelings of weakness and dependence.", "pos": ["direct", "strong", "driven", "loyal to their own", "energetic", "protective", "self-confident"], "neg": ["controlling", "rebellious", "heartless", "domineering", "egocentric", "jealous", "aggressive"], "body": ["The Eight’s wish to protect themselves turns into constant confrontation.", "Eights create an impression of strength and power and can even instil a sense of strength in those around them. They have a “sixth sense” for justice and for finding the culprit. They instinctively know when something is wrong, when injustice or dishonesty is happening.", "When they take something on, they put enormous energy into it.", "Eights want to be bad boys and bad girls: “Good girls go to heaven, bad girls go everywhere!”", "The Eight’s core experience is that life is hostile and dangerous, and that you cannot simply trust others until proven otherwise.", "Eights seek conflict, and if they cannot find it, they create it and draw energy from it. A strong sense of justice (each Eight has their own) often puts them on the side of the weak.", "More than any other type, a well-developed Eight has the gift of helping people discover their real potential — through support rather than competition.", "Although it may look that way, the Eight’s true energy is not anger or rage. It is the wish to run life with justice and loyalty.", "Eights protect the weak but hate cowardice and weakness. Fighting for justice is not only the Eight’s strength but also their weakness. It can make them vengeful, in the name of less injustice.", "The Eight’s gift is innocence: when they stop looking for someone to blame, they can trust whatever happens, without resistance or accusation."], "d": "Self-confident, direct and decisive; protects the weak.", "gt": "The heart opens — uses strength for care and warmth.", "st": "Withdraws, shuts down, becomes suspicious and isolated.", "aff": "You are safe. You can open your heart.", "fam": ["Martin Luther King Jr.", "Winston Churchill", "Frank Sinatra"], "levels": ["Magnanimous and protective: uses strength to protect and empower others, opens the heart.", "Dominant and direct: tries to control situations, tests people through confrontation.", "Destructive and ruthless: crushes others by force, sees everything as war."], "sub": {"sp": ["“Survival”", "A practical, laconic Eight; focused on resources, material security and control."], "so": ["“Solidarity”", "A protective Eight; uses strength to defend the group and the weak, warmer and more loyal."], "sx": ["“Possession”", "The most passionate and rebellious Eight; wants a central place in loved ones’ lives and total loyalty."]}, "prac": ["Notice when you cover weakness with strength, and admit it to someone close.", "Before reacting, breathe out and ask: “Does this really need a fight right now?”", "Let someone else take care of you, at least once."], "rel": ["Protection, strength, directness and decisions.", "Honesty, directness and the trust to show vulnerability.", "Fights loudly and directly, tries to take control."], "fc": ["What I fear most is being controlled or harmed by someone.", "What I want most is to be strong and in charge of my own life.", "My attention automatically goes to power and justice.", "Under stress I become more aggressive and controlling."]}, "9": {"name": "The Peacemaker", "alt": "Dove of Peace", "need": "To escape, to avoid.", "fear": "Separation, loss.", "want": "Inner stability and peace.", "motive": "Nines are driven by keeping the peace, having good relationships with others and avoiding conflict.", "pos": ["pleasant", "peaceful", "generous", "attentive", "accepting", "diplomatic", "compassionate"], "neg": ["dismissive", "forgetful", "stubborn", "passive-aggressive", "judgemental", "avoidant"], "body": ["The Nine’s wish to live peacefully and harmoniously turns into inaction. A kind, modest type: sensitive, accommodating and a good helper.", "With their sense of fairness, Nines can voice a bitter truth so gently that the other side accepts it calmly. In a Nine’s presence, many people find it easier to rest and unwind.", "Nines often lack the courage, or do not consider themselves important enough, to show their gifts to others, so their talents appear unnoticed and fade away.", "Caring for a Nine is easy. It is enough simply to love them.", "Sometimes Nines are very inert and unrealistically lazy people. They love to postpone important obligations and avoid anything very difficult that requires a lot of energy.", "The Nine’s fixation is self-diminishment — especially in their own eyes.", "The Nine’s defence mechanism is withdrawing into themselves. They try to escape problems more than other types do, and this is a kind of addiction. Nines seek external stimulation and strong sensations because they find it hard to motivate themselves from within.", "In stressful situations, the Nine tends to step aside. They do not want to burden other people and do not ask others for understanding or help.", "The Nine’s lure is sleep and comfort. Their attitude is: “It’s not worth the effort. Why stand up when I can sit?” Nines can stubbornly do nothing to change a situation.", "A Nine needs to find their gift and show it. They are people who fill this world with unconditional love and acceptance."], "d": "Accepting, steady and supportive; can see every side.", "gt": "Their own desires awaken — becomes active and purposeful.", "st": "Anxiety and doubt appear — becomes nervous and defensive.", "aff": "You matter. Your voice is needed.", "fam": ["Abraham Lincoln", "the Dalai Lama", "Audrey Hepburn"], "levels": ["Whole and alive: calm yet active; brings people together and uses their own voice.", "Accommodating and passive: avoids conflict, agrees with everything, forgets their own wishes.", "Numb and dissociated: completely “switches off”, ignores problems and can no longer act."], "sub": {"sp": ["“Appetite”", "Finds peace in comfort and routine — food, sleep, favourite activities; earthy and stubborn."], "so": ["“Participation”", "Works hard for the group; wants to be accepted everywhere and puts their own needs aside."], "sx": ["“Fusion”", "Merges with a loved one, their wishes and life; may lose their own sense of self."]}, "prac": ["In the morning, ask yourself: “What do I want today?” and write it down.", "Voice your opinion in one small situation, even if others think differently.", "Make a priority list: the important things first, then the small ones."], "rel": ["Calm, acceptance, patience and stability.", "Encouragement to speak their mind, a gentle tone and time.", "Avoids, agrees outwardly and stubbornly resists inside."], "fc": ["What I fear most is conflict and losing connection.", "What I want most is inner peace and harmony.", "My attention automatically goes to other people’s wishes and to harmony.", "Under stress I switch off, procrastinate and try to change nothing."]}}, "wings": {"1w9": ["The Idealist", "Calmer, more reserved and philosophical; defends principles quietly."], "1w2": ["The Advocate", "Warmer and more active; fights for justice alongside people."], "2w1": ["The Servant", "A principled carer; helps others out of a sense of duty."], "2w3": ["The Host", "Open, charming and sociable; thrives on relationships."], "3w2": ["The Charmer", "Friendly, people-oriented success."], "3w4": ["The Professional", "Serious and introspective; seeks a personal signature in their work."], "4w3": ["The Aristocrat", "More ambitious and sociable; expresses uniqueness outwardly."], "4w5": ["The Bohemian", "More withdrawn and intellectual; an explorer of the inner world."], "5w4": ["The Iconoclast", "A creative, unconventional thinker."], "5w6": ["The Problem Solver", "Practical, systematic and analytical."], "6w5": ["The Defender", "More independent, serious and intellectual."], "6w7": ["The Buddy", "More playful, sociable and warm."], "7w6": ["The Entertainer", "Friendly, loyal, focused on connecting with people."], "7w8": ["The Realist", "Firmer, more pragmatic and demanding."], "8w7": ["The Maverick", "Energetic, bold and adventurous."], "8w9": ["The Bear", "Calm strength; protective, steady, slow to anger."], "9w8": ["The Referee", "More grounded, self-assured and direct."], "9w1": ["The Dreamer", "More idealistic, orderly and reserved."]}, "centers": {"gut": ["Instinctive (body) centre", "anger", "Body centre: autonomy, boundaries, control."], "heart": ["Emotional (heart) centre", "shame", "Heart centre: image, recognition, relationships."], "head": ["Intellectual (head) centre", "fear", "Head centre: security, planning, understanding."]}, "history": {"lead": "The Enneagram has two layers: the symbol itself, which appeared in the early 20th century, and the psychological system of types that was later attached to it.", "items": [["1910s–1920s", "George Gurdjieff", "A mystic of Greek-Armenian origin who taught the nine-pointed symbol to students in Moscow and St Petersburg. In 1919 he founded the Institute for the Harmonious Development of Man in Tbilisi, then moved to France. For him, the symbol was a map of cosmic processes, not a personality typology."], ["1950s–1960s", "Oscar Ichazo", "The Bolivian teacher matched the symbol with “ego fixations” and “passions” — this is where the idea of nine types begins. In 1968 he founded his own school in Arica, Chile."], ["1970s", "Claudio Naranjo", "The Chilean psychiatrist translated Ichazo’s scheme into the language of modern psychology and taught in California, USA. He also described the 27 instinctual subtypes. Through his students, the system spread into Jesuit circles as well."]]}, "med": ["Settle in so that nothing in your body is strained. Place your feet on the floor and rest your hands on your knees. If you like, close your eyes.", "Take a deep breath in… and slowly breathe out. (pause) Once more. Feel your shoulders drop as you exhale. (pause)", "Now move your attention through the three centres. First, your belly: this is where your strength, your boundaries and your ability to say “no” live. Simply notice what you feel there. (pause) Then your heart: this is where the wish to be seen and loved lives. What is happening there now? (pause) Finally, your head: this is where thinking, planning and the search for safety live. Notice how noisy or quiet it is. (pause)", "Now imagine your type entering the room as a person and sitting down in front of you. It has always been with you, trying to protect you. Look at it. What is its face like? Tired? Restless? (pause)", "Quietly ask it: “What are you most afraid of?” and listen. The answer may come as a word, an image or simply a sensation. (pause) Now ask: “What do you really need?” (pause)", "Thank it for trying to protect you for so long. Then tell it the words it needs to hear most — your type’s phrase is below. Repeat it three times, once with each exhale. (pause)", "Imagine how your type’s face changes as it hears these words. It may smile, or breathe out with relief. Notice where you feel this change in your own body. (pause)", "Finally, imagine it coming closer and returning into you — no longer as a guard, but as a rested part of you. Breathe in deeply… and out. Slowly move your fingers, feel your feet on the floor, and when you are ready, open your eyes."]}, "ru": {"ui": {"guide": "Подробнее о типе в путеводителе ↓", "title": "Тест по эннеаграмме", "eyebrow": "Тест по эннеаграмме", "h1": "Узнай свой тип", "intro": "Прочитай каждое утверждение и отметь, насколько оно тебе подходит. Думай не о том, кем хочешь быть, а о том, кто ты на самом деле — особенно на протяжении большей части взрослой жизни.", "short": "Короткий тест", "shortSub": "27 утверждений · около 5 минут", "full": "Полный тест", "fullSub": "54 утверждения · около 10 минут", "tip": "Каждый раз утверждения генерируются в новом случайном порядке. Короткий тест случайно выбирает из банка по три утверждения на каждый тип.", "back": "← Назад", "keys": "Клавиатура: 1–5", "res": "Твой результат", "type": "Эннеатип", "also": "также", "need": "Основная потребность", "fear": "Основной страх", "want": "Основное желание", "motive": "Основной мотив", "scores": "Баллы по всем типам", "note": "Тест лишь указывает направление. В эннеаграмме свой тип в итоге определяешь только ты: прочитай описания первых двух-трёх типов и подумай, чей страх и чьё желание звучат для тебя самыми знакомыми.", "again": "Сгенерировать новый тест", "wing": "Вероятное крыло", "wingOr": "Крыло: {a} или {b}", "tie": "Первые два типа ({a} и {b}) почти равны — внимательно прочитай оба описания.", "next": "На втором месте — тип {a} ({an}), на третьем — тип {b} ({bn}).", "ql": "«", "qr": "»", "n_test": "Тест", "n_guide": "Путеводитель", "n_history": "История", "n_types": "Типы", "n_wings": "Крылья", "n_moves": "Переходы", "n_sub": "Подтипы", "n_rel": "Отношения", "n_prac": "Практика", "g_eyebrow": "Интерактивный путеводитель", "g_title": "Эннеаграмма", "g_lead": "Девятиконечный символ и девять типов личности. Нажми на любую цифру на схеме, а потом переключи режим, чтобы увидеть её крылья и направления роста и стресса.", "m_lines": "Линии", "m_wings": "Крылья", "m_moves": "Рост и стресс", "lg_gut": "Инстинктивный центр", "lg_heart": "Эмоциональный центр", "lg_head": "Интеллектуальный центр", "lg_growth": "Направление роста", "lg_stress": "Направление стресса", "dia_label": "Схема эннеаграммы с девятью типами", "tab_profile": "Профиль", "tab_dev": "Развитие", "tab_links": "Связи", "pos": "Сильные стороны", "neg": "Слабые стороны", "more": "Подробнее", "gs_title": "Рост и стресс", "growth_arrow": "Рост →", "stress_arrow": "Стресс →", "wings_t": "Крылья", "famous_t": "Известные люди", "famous_hint": "Их типы определили авторы эннеаграммы по биографии — это предположение, а не факт.", "levels_t": "Уровни развития", "lv": ["Здоровый", "Средний", "Нездоровый"], "sub_t": "Инстинктивные подтипы", "prac_t": "Ежедневная практика", "phrase_t": "Фраза для тебя", "h_history": "Краткая история", "h_types": "Девять типов", "types_lead": "Типы делятся на три центра — в зависимости от того, откуда человек больше всего «живёт» и какая эмоция им управляет. Нажми на тип, чтобы увидеть его на схеме.", "center_emo": "Основная эмоция", "h_wings": "Крылья", "wings_lead": "Крыло — соседний тип на круге, черты которого «окрашивают» основной тип. У каждого типа два возможных крыла: например, у Четвёрки — Тройка или Пятёрка. Запись 4w5 означает «Четвёрка с крылом Пятёрки». Обычно одно крыло сильнее, но проявляться могут оба.", "h_moves": "Переходы: рост и стресс", "moves_lead": "Внутренние линии схемы показывают, как тип меняется в разных состояниях. Каждая цифра связана с двумя другими: в одну сторону она движется в росте (интеграция), в другую — в стрессе (дезинтеграция).", "growth_h": "Рост (интеграция)", "growth_p": "Когда человек чувствует себя спокойно и в безопасности, он перенимает здоровые черты другого типа — словно восполняет то, чего раньше не хватало.", "stress_h": "Стресс (дезинтеграция)", "stress_p": "Под давлением человек начинает проявлять нездоровые привычки другого типа. Это не «плохо» — это сигнал, что чему-то нужно внимание.", "line_hex": "Гексада, в направлении стресса (рост — в обратную сторону)", "line_tri": "Треугольник, в направлении стресса (рост — в обратную сторону)", "th_type": "Тип", "th_growth": "В росте", "th_stress": "В стрессе", "moves_note": "Некоторые современные учителя считают, что у обоих направлений есть здоровая и нездоровая сторона, поэтому эту схему стоит воспринимать как тенденцию, а не правило.", "h_sub": "Инстинктивные подтипы", "sub_lead": "У каждого человека три инстинкта, но обычно один доминирует. Тип и доминирующий инстинкт вместе дают 27 подтипов. Описания следуют традиции Клаудио Наранхо.", "inst": {"sp": ["Самосохранение (SP)", "Тело, безопасность, ресурсы, комфорт, здоровье."], "so": ["Социальный (SO)", "Группа, принадлежность, роль и статус в обществе."], "sx": ["Один на один (SX)", "Интенсивность, притяжение, глубокая связь с одним человеком."]}, "h_rel": "Типы в отношениях", "rel_lead": "Выбери два типа — свой и тип партнёра, друга или коллеги — и посмотри, что они дают друг другу, что им нужно и как они ведут себя в конфликте.", "rel_a": "Первый тип", "rel_b": "Второй тип", "rel_gift": "Даёт", "rel_need": "Нуждается", "rel_conf": "В конфликте", "rel_same": "Один и тот же тип: вы очень хорошо понимаете друг друга, но и слепые зоны у вас одинаковые — старайтесь следовать направлению роста друг друга.", "rel_center": "Вы оба относитесь к одному центру ({c}), поэтому у вас похожая основная эмоция — {e}.", "rel_wing": "Вы соседи на круге, то есть крылья друг для друга, и найдёте много общего.", "rel_growth": "В росте {a} перенимает здоровые черты {b} — {bn} может стать для него вдохновением.", "rel_stress": "В стрессе {a} проявляет нездоровые черты {b} — в этих отношениях это может быть особенно заметно.", "rel_tip": "Счастливой может быть любая пара — главное, чтобы каждый знал, что нужно другому.", "h_prac": "Практика", "prac_lead": "Фразы, которые каждому типу важнее всего услышать.", "med_t": "Медитация: встреча со своим типом", "phrases_t": "Фразы для типов", "foot_note": "Эннеаграмма — инструмент саморефлексии, а не диагноз. Лучше всего человек узнаёт свой тип сам — по мотивации и страху, которые стоят за поведением, а не только по поведению.", "cta_t": "Хочешь глубже понять свой тип?", "cta_p": "На индивидуальной консультации мы вместе разберём твой тип, крыло, подтип и пути роста.", "cta_btn": "Записаться на консультацию", "share_btn": "Создать карточку для сторис", "share_t": "Карточка с результатом", "share_save": "Сохранить изображение", "share_hint": "Если кнопка не работает, нажми и удерживай изображение, чтобы сохранить.", "share_close": "Закрыть", "card_top": "Мой эннеатип", "card_bottom": "Пройди тест", "stats_line": "{p}% прошедших этот тест — тоже тип {n} (всего результатов: {t}).", "tb_eyebrow": "Уточнение", "tb_t": "Два типа очень близки", "tb_p": "Первые два типа набрали почти одинаковые баллы. В четырёх парах выбери утверждение, которое точнее тебя описывает.", "tb_round": "{i} / {n}", "tb_note": "Результат уточнён дополнительными вопросами.", "title_page": "Эннеаграмма — тест и интерактивный путеводитель"}, "lbl": ["Совсем не про меня", "Скорее не про меня", "Отчасти", "Скорее про меня", "Точно про меня"], "q": {"1": ["Я часто замечаю, что не так и как это можно исправить.", "Мне трудно расслабиться, пока дело не доведено до конца и не сделано правильно.", "Я часто слышу в голове голос внутреннего критика.", "Меня раздражает, когда люди нарушают правила или ведут себя безответственно.", "Для меня важно, чтобы всё делалось правильно и честно.", "Я часто сдерживаю злость, потому что считаю, что выражать её неправильно."], "2": ["Я легко чувствую, что нужно другим, часто раньше них самих.", "Мне трудно отказать, когда кому-то нужна моя помощь.", "Для меня важно, что во мне нуждаются.", "Мне обидно, когда мою заботу не замечают или не ценят.", "Говорить о своих потребностях мне трудно, о чужих — легко.", "Отношения и близость — в центре моей жизни."], "3": ["Достижение целей даёт мне энергию и ощущение собственной ценности.", "Я хорошо знаю, как подать себя в разной обстановке.", "Неудача для меня — одно из самых тяжёлых переживаний.", "Я часто откладываю чувства в сторону, чтобы сделать дело.", "Мне важно, как другие оценивают мой успех.", "Я люблю соревноваться и побеждать."], "4": ["Я часто чувствую, что отличаюсь от других и меня до конца не понимают.", "Мои эмоции очень глубокие и сильные.", "Меня притягивают грусть, ностальгия и то, что утрачено.", "Мне важно, чтобы моя жизнь и окружение отражали мою уникальность.", "Иногда я завидую тем, у кого, кажется, есть то, чего не хватает мне.", "Обыденность и поверхностность меня угнетают."], "5": ["Прежде чем во что-то включиться, я предпочитаю сначала хорошо это изучить.", "Мне нужно много личного пространства и времени наедине с собой.", "Долгое общение с людьми отнимает у меня силы.", "Знания и компетентность — мой источник безопасности.", "Сначала я обдумываю эмоции и только потом их чувствую.", "Я не люблю, когда от меня много требуют — времени, сил, внимания."], "6": ["Я часто заранее думаю о том, что может пойти не так.", "Верность людям, которым я доверяю, для меня очень важна.", "Прежде чем принять решение, я часто спрашиваю мнение других.", "К новым людям и ситуациям я поначалу отношусь с подозрением.", "Мне спокойно, когда я знаю, что у меня есть надёжная опора.", "Я часто сомневаюсь в себе, но в кризисе действую смело."], "7": ["У меня всегда много планов и идей.", "Скука и ограничения для меня невыносимы.", "Когда мне больно, я стараюсь быстро переключиться на что-то приятное.", "Я люблю новый опыт, путешествия и всё новое.", "Мне трудно долго концентрироваться на одном деле.", "Я оптимист и в любой ситуации ищу хорошее."], "8": ["Я прямо говорю, что думаю, даже если другим это не нравится.", "Мне не нравится, когда кто-то пытается меня контролировать.", "Мне трудно показывать слабость.", "Видя несправедливость, я сразу вмешиваюсь и защищаю слабых.", "Я не боюсь конфликтов, иногда они даже придают мне сил.", "Я естественно беру на себя роль лидера."], "9": ["Я избегаю конфликтов и стремлюсь к гармонии.", "Я легко вижу позицию каждой стороны.", "Я часто подстраиваюсь под желания других, чтобы не нарушать покой.", "Мне трудно заняться главным — я легко увязаю в мелочах.", "Иногда я даже не знаю, чего на самом деле хочу.", "Я люблю комфорт, рутину и спокойную обстановку."]}, "types": {"1": {"name": "Реформатор", "alt": "идеалист, перфекционист", "need": "Быть совершенным, идеалистичным.", "fear": "Быть нечестным или плохим, иметь изъяны.", "want": "Быть хорошим, справедливым, уравновешенным.", "motive": "Хочет быть правым, бороться и всё улучшать, соответствовать своим идеалам, оправдывать себя и не давать никому повода для критики или осуждения.", "pos": ["этичный", "надёжный", "продуктивный", "предусмотрительный", "идеалистичный", "честный", "порядочный", "любит чистоту", "дисциплинированный"], "neg": ["негибкий", "категоричный", "критичный к другим", "слишком серьёзный", "контролирующий", "тревожный", "ревнивый"], "body": ["Глубинный мотив Единицы — гнев. Единицы злятся из-за того, что мир несовершенен.", "Тип 1 относится к телесному центру: рациональный, принципиальный, целеустремлённый, с сильным самоконтролем и перфекционизмом, добросовестный и этичный, с острым чувством правильного и неправильного.", "Единицы хорошо организованы, аккуратны и трудолюбивы. Они стараются поддерживать высокие стандарты, но могут становиться и критиками.", "Это учителя и сторонники перемен: всегда стремятся всё улучшить, но боятся ошибиться.", "Жизнью Единицы управляет стремление к совершенству. Они прекрасно осознают свою ответственность и обязательства и часто очень пунктуальны. Это серьёзные люди, которые редко шутят и позволяют себе отдых только тогда, когда окончательно завершат дело.", "Единицам, как правило, трудно справляться с неудовлетворённостью и нетерпением. Они склонны осуждать и наказывать себя, подавлять и уничтожать собственные желания.", "В лучшем своём проявлении Единица становится проницательной, реалистичной и благородной, человечной и вдохновляющей, действует наилучшим образом."], "d": "Принципиальный, целеустремлённый, с сильным самоконтролем. Ясно видит, каким мир «должен быть», и старается его улучшить.", "gt": "Внутренний критик затихает — появляются лёгкость, спонтанность и радость.", "st": "Становится меланхоличным, чувствует себя непонятым и одиноким.", "aff": "С тобой уже всё хорошо. Можешь отдохнуть.", "fam": ["Махатма Ганди", "Конфуций", "Жанна д’Арк"], "levels": ["Мудрый и реалистичный: принимает несовершенство, действует спокойно и справедливо, вдохновляет других.", "Упорядоченный и требовательный: оценивает всё по тому, «как должно быть», часто критикует себя и других.", "Нетерпимый и жёсткий: видит только ошибки, становится догматичным, склонен к самобичеванию и наказанию других."], "sub": {"sp": ["«Тревога»", "Самая сдержанная Единица; ищет безопасность в точности и планировании, постоянно волнуется, что что-то пойдёт не так."], "so": ["«Образец»", "Чувствует, что должна быть примером правильного поведения; берёт на себя роль учителя и знает, «как правильно»."], "sx": ["«Рвение»", "Самая открыто гневная Единица; стремится исправить других и мир — реформатор-борец."]}, "prac": ["Когда включается внутренний критик, спроси себя: что значит «достаточно хорошо» в этой ситуации?", "Каждый день делай одну вещь просто ради удовольствия, без результата.", "Замечай гнев в теле — в челюсти, плечах — и называй его, пока он не превратился в критику."], "rel": ["Надёжность, честность, стабильность и внимание к деталям.", "Признание того, что он старается; лёгкость и юмор; мягкая критика.", "Становится критичным, сдерживает гнев и настаивает на «правильном»."], "fc": ["Больше всего я боюсь поступить неправильно или плохо.", "Больше всего я хочу быть хорошим человеком и поступать справедливо.", "Моё внимание автоматически направлено на ошибки и на то, что можно улучшить.", "В стрессе я становлюсь критичнее и строже."]}, "2": {"name": "Помощник", "alt": "альтруист", "need": "Быть нужным.", "fear": "Быть ненужным, бесполезным, недостойным любви.", "want": "Чувствовать, что его любят.", "motive": "Двойки хотят, чтобы их любили и ценили, и стремятся выражать тёплое отношение к людям.", "pos": ["любящий", "заботливый", "легко адаптируется", "проницательный", "щедрый", "вдохновляющий", "тепло откликается на чувства других"], "neg": ["страдающий", "обиженный", "манипулятивный", "собственнический", "истеричный", "чрезмерно опекающий"], "body": ["Тип 2 относится к сердечному центру: заботливый, ориентированный на отношения, собственнический, щедрый и демонстративный. Двойки любят радовать людей. Свои таланты они направляют на то, чтобы удовлетворять потребности других, заботиться об их здоровье, питании, образовании и благополучии.", "Двойки легко плачут, потому что они чувствительны и эмоциональны. Это «плюшевые мишки», которые любят объятия и ласку. Двойка любит говорить об отношениях и любви. Им очень хочется, чтобы их любили всем сердцем и позволили жить ради любимых людей.", "У Двоек обычно широкий круг знакомых и друзей, и они хотят быть особенно важными для своих друзей.", "Любовь и забота, которые они чувствуют, и настоящая доброта, которую они проявляют, дают им ощущение собственной ценности. Главное в жизни Двойки — любовь, общение, семья и дружба.", "Когда Двойка здорова и уравновешенна, она по-настоящему любящая, щедрая и внимательная. Она притягивает людей, как мёд пчёл.", "Здоровые Двойки оживляют других своей благодарностью и вниманием, помогают людям увидеть в себе достоинства, которых те раньше не замечали."], "d": "Тёплый, щедрый и внимательный; легко чувствует потребности других и помогает.", "gt": "Возвращает внимание к своим чувствам — становится честным с собой.", "st": "Ощущение, что его не замечают, превращается в гнев — становится требовательным и контролирующим.", "aff": "Тебя любят за то, кто ты есть, а не только за то, что ты делаешь.", "fam": ["Мать Тереза", "Десмонд Туту", "Долли Партон"], "levels": ["Бескорыстный и по-настоящему любящий: помогает без ожиданий и уважает свои собственные потребности.", "Угождающий и вовлечённый: пытается заслужить любовь заботой, с трудом отказывает, втайне ждёт благодарности.", "Манипулятивный и требовательный: превращает заботу в долг, чувствует себя жертвой и обвиняет других."], "sub": {"sp": ["«Привилегия»", "Более детская и обаятельная; просит заботы и для себя, осторожнее и меньше отдаёт."], "so": ["«Амбиция»", "Сильная Двойка-лидер; влиятельна в группе, через помощь обретает положение и значимость."], "sx": ["«Соблазнение»", "Самая страстная Двойка; ищет любви конкретного человека, покоряет привлекательностью и самоотдачей."]}, "prac": ["Прежде чем предложить помощь, спроси себя: «А что нужно мне сейчас?»", "Тренируйся отказывать в небольших просьбах — без извинений.", "В конце дня запиши одно, что ты сделал(а) для себя."], "rel": ["Тепло, внимание, заботу и эмоциональную поддержку.", "Благодарность, проявления любви и внимание к его собственным потребностям.", "Чувствует, что его не ценят, обижается и иногда обвиняет."], "fc": ["Больше всего я боюсь, что я никому не нужен(на) и меня не любят.", "Больше всего я хочу чувствовать, что меня любят.", "Моё внимание автоматически направлено на потребности других.", "В стрессе мне обидно, что мою заботу не ценят."]}, "3": {"name": "Мотиватор", "alt": "целеустремлённый", "need": "Быть успешным.", "fear": "Быть бесполезным, никчёмным.", "want": "Чувствовать, что его ценят и что он значим.", "motive": "Хочет состояться, выделяться среди других, быть в центре внимания, восхищать и производить впечатление.", "pos": ["оптимистичный", "уверенный", "старательный", "эффективный", "целеустремлённый", "энергичный", "практичный"], "neg": ["лживый", "нарциссичный", "надменный", "поверхностный", "мстительный", "чрезмерно соревновательный"], "body": ["Тип 3 относится к сердечному центру. Тройки уверен  "с богатой фантазией", "продуктивный", "увлечённый", "быстрый", "уверенный", "обаятельный", "любознательный"], "neg": ["самовлюблённый", "импульсивный", "несобранный", "бунтарский", "недисциплинированный", "собственнический", "маниакальный", "саморазрушительный", "беспокойный"], "body": ["Стремление Семёрки к счастью нередко перерастает в маниакальное бегство от жизни.", "Семёрки — люди, излучающие радость и оптимизм. Они полны юмора, креативны, весёлы, жизнерадостны и обаятельны — пока в один прекрасный день не заметят, что всё это ещё и защищает их от тревоги и боли.", "Семёрка любознательна. Кажется, того, что у них есть или что они уже знают, всегда мало. Им нужны перемены, стимуляция и новый опыт. У них всегда «несколько утюгов включено», чтобы оставить пути отступления и избежать сильной привязанности к чему-то или к кому-то.", "Они редко надолго задерживаются на одном месте работы. Им интересно заниматься несколькими увлекательными делами одновременно.", "Искушение Семёрки — идеализм. Им нужно быть уверенными, что они работают ради хорошей цели, которая приносит радость им и другим.", "Семёрки избегают боли. Их метод удивительно прост: «Хочу быть весёлым, а не грустным. Хочу наслаждаться жизнью». Семёрка несчастна, когда несчастны другие. Вокруг неё должна быть благоприятная атмосфера.", "Семёрка может переусердствовать во всём: в еде, выпивке, работе, количестве проектов, признании, в стремлении к лучшему жилью.", "Семёрки наделены чувством радости, которое несут людям."], "d": "Оптимистичный, энергичный и разносторонний; всегда ищет новые возможности.", "gt": "Останавливается и углубляется — появляются фокус, тишина и созерцание.", "st": "Становится критичным, нетерпеливым и жёстким.", "aff": "Здесь, в этот момент, у тебя есть всё, что нужно.", "fam": ["Вольфганг Амадей Моцарт", "Робин Уильямс", "Джим Керри"], "levels": ["Благодарный и глубоко радостный: наслаждается тем, что есть, сосредоточен и делится радостью.", "Беспокойный и рассеянный: постоянно ище   const sum={},max={};for(let k=1;k<=9;k++){sum[k]=0;max[k]=0}
  items.forEach((q,x)=>{sum[q.k]+=ans[x];max[q.k]+=4});
  const pct={};for(let k=1;k<=9;k++)pct[k]=Math.round(sum[k]/max[k]*100);
  const order=Object.keys(pct).map(Number).sort((a,b)=>pct[b]-pct[a]);
  last={pct,order,refined:false};
  if(pct[order[0]]-pct[order[1]]<=8){
    tbs={a:order[0],b:order[1],i:0,pa:0,pb:0,rounds:shuffle([0,1,2,3]),sides:[0,1,2,3].map(()=>Math.random()<.5)};
    show("tb");drawTb();
  } else finish();
}
function drawTb(){
  const t=tbs,r=t.rounds[t.i],A=TY(t.a).fc[r],B=TY(t.b).fc[r],u=U();
  $("tbcount").textContent=fmt(u.tb_round,{i:t.i+1,n:4});

}
$("fc").addEventListener("click",e=>{const b=e.target.closest("button");if(!b)return;
  const k=+b.dataset.k;if(k===tbs.a)tbs.pa++;else tbs.pb++;tbs.i++;
  if(tbs.i<4)drawTb();else{
    if(tbs.pb>tbs.pa){const o=last.order;[o[0],o[1]]=[o[1],o[0]]}
    last.refined=true;finish()}});
function finish(){show("result");renderResult();record()}
function renderResult(){

    <p class="quote">${esc(u.ql+d.aff+u.qr)}</p>`;

  $("close").textContent=pct[order[0]]-pct[order[1]]<=5?fmt(u.tie,{a:order[0],b:order[1]}):fmt(u.next,{a:order[1],an:TY(order[1]).name,b:order[2],bn:TY(order[2]).name});

/* ---------- stats (db) ---------- */
let dbp=null,counts=null;
function getDb(){if(!dbp)dbp=(window.claude&&window.claude.use?window.claude.use("db"):Promise.resolve(null)).catch(()=>null);return dbp}
async function record(){
  if(recorded||!last)return;recorded=true;
  const db=await getDb();if(!db)return;
  try{await db.collection("results").add({type:last.order[0],wing:last.wingKey||"",lang,full:items.length>30,ts:Date.now()})}catch(e){}
  try{const snap=await db.collection("results").limit(2000).get();counts={};let t=0;
    snap.docs.forEach(d=>{const v=d.data();const k=v&&+v.type;if(k>=1&&k<=9){counts[k]=(counts[k]||0)+1;t++}});counts.total=t;renderStat()}catch(e){}
}
function renderStat(){
  const el=$("stat");if(!counts||!last||counts.total<10){el.hidden=true;return}
  const k=last.order[0],p=Math.round((counts[k]||0)/counts.total*100);
  el.textContent=fmt(U().stats_line,{p,n:k,t:counts.total});el.hidden=false;
}

/* ---------- share card ---------- */
let dlp=null,cardBlob=null;
function getDl(){if(!dlp)dlp=(window.claude&&window.claude.use?window.claude.use("downloads"):Promise.resolve(null)).catch(()=>null);return dlp}
function wrap(ctx,text,maxW){const words=text.split(" ");const lines=[];let cur="";for(const w of words){const t=cur?cur+" "+w:w;if(ctx.measureText(t).width>maxW&&cur){lines.push(cur);cur=w}else cur=t}if(cur)lines.push(cur);return lines}
async function makeCard(){
  const top=last.order[0],d=TY(top),u=U();
  try{await Promise.all(["400","600","800"].map(w=>document.fonts.load(`${w} 40px FiraGO`)))}catch(e){}
  const W=1080,H=1920,c=document.createElement("canvas");c.width=W;c.height=H;const x=c.getContext("2d");
  const col={gut:"#E2AB40",heart:"#E57B9C",head:"#55B8BF"}[CEN[top]];
  const g=x.createLinearGradient(0,0,0,H);g.addColorStop(0,"#151935");g.addColorStop(1,"#0D1024");x.fillStyle=g;x.fillRect(0,0,W,H);
  // enneagram motif
  x.save();x.translate(W/2,820);x.strokeStyle="rgba(231,233,244,.10)";x.lineWidth=3;
  const R=380,P=k=>{const a=(-90+40*k)*Math.PI/180;return[R*Math.cos(a),R*Math.sin(a)]};
  x.beginPath();x.arc(0,0,R,0,Math.PI*2);x.stroke();
  [[1,4,2,8,5,7,1],[3,6,9,3]].forEach(seq=>{x.beginPath();seq.forEach((k,i)=>{const[a,b]=P(k);i?x.lineTo(a,b):x.moveTo(a,b)});x.stroke()});
  const[px,py]=P(top);x.fillStyle=col;x.beginPath();x.arc(px,py,26,0,Math.PI*2);x.fill();x.restore();
  x.textAlign="center";x.textBaseline="alphabetic";
  x.fillStyle="rgba(231,233,244,.7)";x.font="600 44px FiraGO, sans-serif";x.fillText(lang==="ka"?u.card_top:u.card_top.toUpperCase(),W/2,250);
  x.fillStyle=col;x.font="800 520px FiraGO, sans-serif";x.fillText(String(top),W/2,1000);
  x.fillStyle="#F4F5FA";x.font="800 92px FiraGO, sans-serif";
  let y=1190;wrap(x,d.name,W-160).forEach(l=>{x.fillText(l,W/2,y);y+=100});
  x.fillStyle=col;x.font="600 46px FiraGO, sans-serif";x.fillText(last.wingLabel||"",W/2,y+10);y+=110;
  x.fillStyle="rgba(244,245,250,.92)";x.font="400 50px FiraGO, sans-serif";
  wrap(x,u.ql+d.aff+u.qr,W-200).forEach(l=>{x.fillText(l,W/2,y);y+=68});
  x.fillStyle="rgba(231,233,244,.65)";x.font="600 40px FiraGO, sans-serif";x.fillText(u.card_bottom+" · mariamik.com",W/2,H-150);
  return new Promise(r=>c.toBlob(b=>r(b),"image/png"));
}
$("sharebtn").onclick=async()=>{
  if(!last)return;cardBlob=await makeCard();if(!cardBlob)return;
  const img=$("cardimg");if(img.src)URL.revokeObjectURL(img.src);img.src=URL.createObjectURL(cardBlob);img.alt=U().share_t;

$("savebtn").onclick=async()=>{const dl=await getDl();if(!dl||!cardBlob)return;

function closeModal(){$("modal").hidden=true;$("sharebtn").focus()}
$("mclose").onclick=closeModal;$("modal").addEventListener("click",e=>{if(e.target.id==="modal")closeModal()});

/* ================= GUIDE ================= */
const R=160,CX=200,CY=200,P={};
for(let k=1;k<=9;k++){const a=(-90+40*k)*Math.PI/180;P[k]={x:CX+R*Math.cos(a),y:CY+R*Math.sin(a),a}}
let sel=1,mode="lines",tab="profile";
const svg=$("dia"),NS="http://www.w3.org/2000/svg";
const el=(t,at)=>{const e=document.createElementNS(NS,t);for(const k in at)e.setAttribute(k,at[k]);return e};
function seg(a,b,cls,marker){const A=P[a],B=P[b],dx=B.x-A.x,dy=B.y-A.y,Ln=Math.hypot(dx,dy),o1=27,o2=33;
  return el("line",{x1:A.x+dx/Ln*o1,y1:A.y+dy/Ln*o1,x2:B.x-dx/Ln*o2,y2:B.y-dy/Ln*o2,class:cls,"marker-end":marker?`url(#${marker})`:""})}
function renderDia(){
  svg.innerHTML="";const defs=el("defs",{});
  [["mg","--growth"],["ms","--stress"]].forEach(([id,v])=>{const m=el("marker",{id,viewBox:"0 0 10 10",refX:"6",refY:"5",markerWidth:"5",markerHeight:"5",orient:"auto-start-reverse"});
    const p=el("path",{d:"M0,0 L10,5 L0,10 z"});p.style.fill=`var(${v})`;m.appendChild(p);defs.appendChild(m)});
  svg.appendChild(defs);svg.appendChild(el("circle",{cx:CX,cy:CY,r:R,class:"ring"}));
  [1,4,2,8,5,7,1].forEach((k,i,a)=>{if(i)svg.appendChild(seg(a[i-1],k,"ln"))});
  [3,6,9,3].forEach((k,i,a)=>{if(i)svg.appendChild(seg(a[i-1],k,"ln"))});
  if(mode==="wings"){wingsOf(sel).forEach(w=>{const a1=P[sel].a,a2=P[w].a;let d=a2-a1;if(d>Math.PI)d-=2*Math.PI;if(d<-Math.PI)d+=2*Math.PI;
    const s=a1+Math.sign(d)*.17,e=a2-Math.sign(d)*.17;
    svg.appendChild(el("path",{class:"wingarc",d:`M${CX+R*Math.cos(s)},${CY+R*Math.sin(s)} A${R},${R} 0 0 ${d>0?1:0} ${CX+R*Math.cos(e)},${CY+R*Math.sin(e)}`}))})}
  if(mode==="moves"){svg.appendChild(seg(sel,G[sel],"arr g","mg"));svg.appendChild(seg(sel,S[sel],"arr s","ms"))}
  $("movelegend").hidden=mode!=="moves";
  const wings=mode==="wings"?wingsOf(sel):[];
  for(let k=1;k<=9;k++){const p=P[k];
    let cls="node"+(k===sel?" sel":"")+(wings.includes(k)?" wing":"");
    if(mode==="wings"&&k!==sel&&!wings.includes(k))cls+=" fade";
    if(mode==="moves"&&k!==sel&&k!==G[sel]&&k!==S[sel])cls+=" fade";
    const g=el("g",{class:cls,tabindex:"0",role:"button","aria-label":`${k}: ${TY(k).name}`,"aria-pressed":String(k===sel)});
    g.appendChild(el("circle",{cx:p.x,cy:p.y,r:29,class:"halo"}));
    const dot=el("circle",{cx:p.x,cy:p.y,r:k===sel?24:21,class:"dot"});dot.style.fill=cv(k);g.appendChild(dot);
    const n=el("text",{x:p.x,y:p.y+1,class:"num"});n.textContent=k;g.appendChild(n);
    const lr=R+50,lb=el("text",{x:CX+lr*Math.cos(p.a),y:CY+lr*Math.sin(p.a),class:"lbl"});lb.textContent=TY(k).name.replace(/^The /,"");g.appendChild(lb);
    g.addEventListener("click",()=>pick(k));
    g.addEventListener("keydown",e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();pick(k)}});
    svg.appendChild(g)}
}
function panel(){

    <h3 class="sub">${esc(u.pos)}</h3><div class="tags pos">${d.pos.map(x=>`<span>${esc(x)}</span>`).join("")}</div>

  const dev=`<h3 class="sub" style="margin-top:0">${esc(u.levels_t)}</h3><div class="lvl">${["h","a","u"].map((c2,i)=>`<div class="${c2}"><b>${esc(u.lv[i])}</b><span>${esc(d.levels[i])}</span></div>`).join("")}</div>
    <h3 class="sub">${esc(u.sub_t)}</h3><div class="subs">${["sp","so","sx"].map(s=>`<div><b>${esc(u.inst[s][0])} <span>${esc(d.sub[s][0])}</span></b>${esc(d.sub[s][1])}</div>`).join("")}</div>
    <h3 class="sub">${esc(u.prac_t)}</h3><ul class="pr">${d.prac.map(x=>`<li>${esc(x)}</li>`).join("")}</ul>
    <h3 class="sub">${esc(u.phrase_t)}</h3><p class="phrase">${esc(u.ql+d.aff+u.qr)}</p>`;
  const W=X().wings;
  const links=`<div class="rel"><h3 style="margin-top:0">${esc(u.gs_title)}</h3>
    <div class="move g"><span class="tag">${esc(u.growth_arrow)}</span><span><button data-go>${G[k]} · ${esc(TY(G[k]).name)}</button>. ${esc(d.gt)}</span></div>
    <div class="move s"><span class="tag">${esc(u.stress_arrow)}</span><span><button data-go>${S[k]} · ${esc(TY(S[k]).name)}</button>. ${esc(d.st)}</span></div>
    <h3>${esc(u.wings_t)}</h3><div class="chips">${[l,r].map(w=>{const key=`${k}w${w}`;return `<button class="chip" data-wing><b>${key}</b> ${esc(W[key][0])}${W[key][2]?` <span class="en">(${esc(W[key][2])})</span>`:""}<br><span style="color:var(--muted)">${esc(W[key][1])}</span></button>`}).join("")}</div>
    <h3>${esc(u.famous_t)}</h3><div class="faces">${d.fam.map(n=>`<span class="face"><i aria-hidden="true">${esc(ini(n))}</i>${esc(n)}</span>`).join("")}</div><p class="hint">${esc(u.famous_hint)}</p></div>`;
  p.innerHTML=`<div class="top"><div class="big">${k}</div><div><h2><span aria-hidden="true">${EMO[k]}</span> ${esc(d.name)}</h2>${d.en?`<span class="en">${esc(d.en)}</span>`:""}<div class="alt">${esc(u.also)}: ${esc(d.alt)}</div></div></div>
    <span class="center">${esc(c[0])} · ${esc(c[1])}</span>
    <div class="ptabs" role="tablist">${[["profile",u.tab_profile],["dev",u.tab_dev],["links",u.tab_links]].map(([id,t])=>`<button role="tab" data-tab="${id}" aria-selected="${tab===id}">${esc(t)}</button>`).join("")}</div>
    <div role="tabpanel">${tab==="profile"?prof:tab==="dev"?dev:links}</div>`;
  p.querySelectorAll("[data-tab]").forEach(b=>b.onclick=()=>{tab=b.dataset.tab;panel()});
  p.querySelectorAll("[data-wing]").forEach(b=>b.onclick=()=>setMode("wings"));
  p.querySelectorAll("[data-go]").forEach(b=>b.onclick=()=>setMode("moves"));
}
function pick(k){sel=k;renderDia();panel()}
function setMode(m){mode=m;document.querySelectorAll(".modes button").forEach(b=>b.setAttribute("aria-pressed",String(b.dataset.mode===m)));if(m!=="lines")tab="links";renderDia();panel()}

/* ---------- sections ---------- */

  const x=X(),u=U();
  $("histlead").textContent=x.history.lead;
  $("histlist").innerHTML=x.history.items.map(([t,h,p])=>`<li><time>${esc(t)}</time><div><h3>${esc(h)}</h3><p>${esc(p)}</p></div></li>`).join("");
  $("centers").innerHTML=[["gut",[8,9,1]],["heart",[2,3,4]],["head",[5,6,7]]].map(([c,ks])=>{const C=x.centers[c];
    return `<div class="col" style="--c:var(--${c})"><h3>${esc(C[0])}</h3><p>${esc(C[2])} ${esc(u.center_emo)}: ${esc(C[1])}.</p>${ks.map(k=>`<button class="trow" data-k="${k}"><span class="n">${k}</span><span><span class="tn">${esc(TY(k).name)}</span>${TY(k).en?` <span class="en">${esc(TY(k).en)}</span>`:""}<span class="ts">${esc(TY(k).d)}</span><span class="tf">${esc(TY(k).fam.join(", "))}</span></span></button>`).join("")}</div>`}).join("");

function renderPair(){
  const a=+$("ra").value,b=+$("rb").value,u=U(),x=X(),A=TY(a),B=TY(b);

$("ra").onchange=renderPair;$("rb").onchange=renderPair;
